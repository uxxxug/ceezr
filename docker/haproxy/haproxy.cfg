# الغرض: موزّعُ حملٍ يفحصُ `/ready` فعليًّا ويزيلُ النسخَةَ المُصرِّفةَ من التوزيعِ
#   — وهو عينُ ما يُثبِتُهُ F5-06/SCL-008: «موزّعٌ مع `/ready` صحيح». nginx الحرّ
#   لا يفحصُ `/ready` بنشاطٍ فيُسقِطُ بعدَ فشلِ الاتصالِ لا بعدَ `503 draining`.
# ينتمي إلى: docker/haproxy
# يُتوقَّعُ أن يستخدمه: docker-compose.f5-06.yml

global
  log stdout format raw local0
  maxconn 256

defaults
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  option redispatch
  retries 2

# نهايةٌ أماميّةٌ واحدةٌ تستقبلُ ويبهوكاتِ تلغرام ثمّ توزّعُها round-robin.
frontend gateway_front
  bind :8080
  default_backend gateways

backend gateways
  # الفحصُ النشطُ: طلبُ GET /ready كلَّ ثانيتَين. 200 ⇐ صحّة، 503 ⇐ تصريفٌ
  # فيُرفعُ من التوزيعِ فورًا — لا يُنتظرْ فشلُ اتصالٍ.
  option httpchk GET /ready
  http-check expect status 200
  default-server inter 2s fall 2 rise 1
  server gateway-1 gateway-1:3000 check
  server gateway-2 gateway-2:3000 check
  server gateway-3 gateway-3:3000 check

# لوحةُ تشخيصٍ تُظهرُ حالةَ النسخِ الثلاث (up/down/maint) — لقراءةِ التوجيهِ عبرَ المثيلات.
listen stats
  bind :8404
  mode http
  stats enable
  stats uri /
  stats refresh 5s
