# الغرض: تعريف خدمات Render كبنيةٍ في المستودع لا كنقراتٍ في لوحة تحكّم — البوابة
#   والعامل الخلفي، بمتغيّراتهما وفحوصهما وسياسة نشرهما.
# الحالة: منفّذ فعلياً — القسم 2 البند د.3.
# ينتمي إلى: جذر المستودع (Render Blueprint)
# يُتوقع أن يستخدمه لاحقاً: من ينشر أول مرة، وكل تغيير في متغيّرات البيئة
# ملاحظات مستقبلية:
#   - القيم الحسّاسة كلها `sync: false`: تُدخَل في لوحة Render مرّة ولا تُكتب هنا
#     أبداً. من كتب رمز بوت في ملف مدفوع فقد البوت لا الملف.
#   - عند رفع numInstances فوق 1 يصير SESSION_STORE=redis إلزامياً لا اختيارياً
#     (ADR 0011)، ويصير حدّ المعدّل موزّعاً تلقائياً على نفس المفتاح.
#   - الانتقال إلى Fly.io البحرين لاحقاً يُبدّل هذا الملف ولا يُبدّل شيئاً في الكود:
#     كل ما هنا متغيّرات بيئة وأوامر، ولا شيء منه مستورَد في أي مصدر.

services:
  # ── البوابة: تستقبل ويبهوك تلغرام، وتُخدّم لوحة الإدارة ──────────────────────
  - type: web
    name: waslah-gateway
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.gateway
    region: frankfurt # أقرب منطقة Render إلى السعودية حتى الانتقال إلى البحرين
    plan: starter
    # /ready لا /health: الأول يسأل القاعدة فعلاً، والثاني يجيب بمجرّد أن العملية
    # حيّة — ونسخة حيّة بلا قاعدة تستقبل تحديثات لتفقدها.
    healthCheckPath: /ready
    # Pilot مغلق: مدينة واحدة ونسخة بوابة واحدة حتى تثبت مراقبة التشغيل الحاجة للتوسّع.
    numInstances: 1
    autoDeploy: false # النشر بأمر لا بكل دفعة إلى main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      # مخزن الجلسات: memory صالح لنسخة واحدة فقط. راجع docs/render-deployment-vars.md
      - key: SESSION_STORE
        value: memory
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: DRIVER_BOT_TOKEN
        sync: false
      - key: RIDER_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: BOOTSTRAP_ADMIN_TELEGRAM_ID
        sync: false
      - key: TRANSLATION_PROVIDER
        value: none # قرار المزوّد الإنتاجي مفتوح — ADR 0010
      - key: TRANSLATION_API_KEY
        sync: false
      - key: TRANSLATION_CONTACT_EMAIL
        sync: false
      # المهامّ الدورية داخل عملية البوابة — مُفعَّلة صراحةً هنا، والافتراض في الكود
      # صار `true` أيضاً (packages/shared/config). السبب: خدمة `waslah-worker` أدناه
      # معرَّفة في هذا الملف ولكنّها غير مُنشأة فعلاً في Render حسب
      # `docs/directive-item-0-live-diagnosis.md` §0.2، ومع `false` لم تُنفَّذ مهمّة دورية
      # واحدة أبداً: لا اشتراك ينتهي، ولا عرض يُسقَط بمهلته، ولا نسخة احتياطية تُؤخَذ.
      # تشغيلهما معاً ليس خطراً: القفل الموزّع يجعل إحداهما تتخطّى بحالة
      # skipped_locked_elsewhere. فمتى أُنشئت خدمة العامل وأُريد تفريدها بالمهامّ
      # فليُبدَل هذا السطر إلى "false" صريحة.
      - key: RUN_WORKER_IN_GATEWAY
        value: "true"
      # ── النسخ الاحتياطي اليومي إلى Google Drive (البند 7) ──────────────
      # كلها sync: false: أسرار لا تُكتب هنا. غيابها يُعطّل المهمّة بصمت لا يوقف الإقلاع.
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_DRIVE_BACKUP_FOLDER_ID
        sync: false
      - key: BACKUP_RETENTION_COUNT
        sync: false
      # مجلّد نسخٍ محليّ بديل عن Google Drive حين تتعطّل اعتماداته. أقلّ حمايةً
      # من مخزنٍ خارجيّ لكنّه ليس عدماً، وغيابه يعيد السلوك إلى Drive وحده.
      - key: BACKUP_LOCAL_DIR
        sync: false
      # ── الرصد: سجلّ مقاييس Prometheus على /metrics ──────────────────────
      # يفشل مغلقاً بغياب السرّ (401): مقاييسُ منصّةٍ مفتوحةٌ للعالم تكشف أحجام
      # الأعمال وأوقات الذروة وعدد السائقين لمن طلب الرابط.
      - key: METRICS_TOKEN
        sync: false
      # ── طبقة الدفع: اشتراك السائق الشهري فقط (البند 8) ──────────────────
      # مزوّدا Tap وMoyasar مدمجان فعلاً. كلها sync: false — أسرار لا تُكتب هنا،
      # وغيابها يُعطّل مسار الدفع وحده بصمت لا يوقف الإقلاع.
      #
      # ‏PAYMENT_PROVIDER: tap أو moyasar للدفع الحقيقي، أو manual للتفعيل اليدوي عبر الدعم.
      - key: PAYMENT_PROVIDER
        sync: false
      # مفتاح Tap السرّي (sk_…): Bearer للـAPI ومفتاح HMAC للويبهوك معاً.
      - key: TAP_SECRET_KEY
        sync: false
      # صفحة العودة بعد الدفع — لازمة لمدى و3DS وليست سرّاً.
      - key: TAP_REDIRECT_URL
        sync: false
      # عنوان ويبهوك Tap لهذه الخدمة.
      - key: TAP_POST_URL
        sync: false
      # مفتاح Moyasar السرّي (sk_…) يُستخدم كاسم مستخدم في Basic auth.
      - key: MOYASAR_SECRET_KEY
        sync: false
      # السرّ الذي يُثبِته Moyasar داخل جسم الويبهوك (secret_token). لم يعد
      # ‏PAYMENT_WEBHOOK_SECRET مقروءاً: مقارنةُ سرٍّ في ترويسةٍ مخترعة كانت تجعل
      # معرفةَ السرّ وحدها كافيةً لتفعيل أي اشتراك بأي مبلغ.
      - key: MOYASAR_WEBHOOK_SECRET
        sync: false
      # صفحة النتيجة التي يُعاد إليها الدافع بعد الدفع (عامّة لا سرّ فيها).
      - key: MOYASAR_CALLBACK_URL
        sync: false
      - key: MOYASAR_SUCCESS_URL
        sync: false
      - key: MOYASAR_BACK_URL
        sync: false
      - key: PAYMENT_ENVIRONMENT
        sync: false
      - key: ENABLE_DRIVER_SUBSCRIPTION
        sync: false
      # ── طبقة الخرائط والتوجيه (البند 9 والمرحلة 15) ──────────────────────
      # ‏ROUTING_PROVIDER: none افتراضاً. ضبطه على osrm يُلزم OSRM_BASE_URL،
      # وإلاّ مُنع الإقلاع — وهو أسلمُ من خدمةٍ موعودٍ بها وصامتة.
      - key: ROUTING_PROVIDER
        sync: false
      - key: OSRM_BASE_URL
        sync: false
      - key: MAP_STYLE_URL
        sync: false
      - key: MAP_PROVIDER
        sync: false
      - key: MAP_TILES_PUBLIC_KEY
        sync: false
      # ── طبقة التتبّع اللحظي (البند 9) ──────────────────────────────────────
      # كلّها اختياريّة: الغياب يعني افتراض المجال في packages/domain/geo/gps-fix.ts.
      # وكانت هذه الكتلة تحمل أسماءً لا وجود لها في .env.example ولا في الكود
      # (IDLE_INTERVAL بلا GPS_، MAX_SPEED بلا REASONABLE_) فمن ضبطها هنا ضبط
      # أسماءً لا يقرؤها أحد. الأسماء الآن موحَّدةٌ ومقروءةٌ، و scripts/check-env-drift.ts
      # يُسقط البناء إن عاد الانحراف.
      - key: TRACKING_GPS_INTERVAL_SECONDS
        sync: false
      - key: TRACKING_GPS_IDLE_INTERVAL_SECONDS
        sync: false
      - key: TRACKING_MIN_DISTANCE_METERS
        sync: false
      - key: TRACKING_TELEPORT_THRESHOLD_METERS
        sync: false
      - key: TRACKING_MAX_REASONABLE_SPEED_KMH
        sync: false
      - key: TRACKING_MAX_ACCURACY_METERS
        sync: false
      - key: TRACKING_MAX_TIME_DRIFT_SECONDS
        sync: false
      # ‏TRACKING_TOKEN_BASE_URL: أساسُ روابط التتبّع المُشارَكة (§4.2). غيابُه
      # يُطفئ ميزةَ الرابط صريحاً بلا كسر أيّ شيء آخر، ووجودُه يُلزم https في
      # الإنتاج. لا يُشتقّ من ترويسة الطلب أبداً — التفصيل في packages/shared/config.
      - key: TRACKING_TOKEN_BASE_URL
        sync: false

  # ── العامل الخلفي: المهامّ الدورية بقفل موزَّع ────────────────────────────────
  - type: worker
    name: waslah-worker
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.worker
    region: frankfurt
    plan: starter
    numInstances: 1
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      # العامل لا يخدّم حواراً فلا يقرأ جلسات؛ يُترك memory بلا أثر.
      - key: SESSION_STORE
        value: memory
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: DRIVER_BOT_TOKEN
        sync: false
      - key: RIDER_BOT_TOKEN
        sync: false
      # العامل لا يستقبل ويبهوك، والمتغيّر إلزامي في الإعداد فيُمرَّر نفس القيمة
      # كي لا يفشل الإقلاع على تحقّقٍ لا يخصّه.
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: BOOTSTRAP_ADMIN_TELEGRAM_ID
        sync: false
      - key: TRANSLATION_PROVIDER
        value: none
      - key: TRANSLATION_API_KEY
        sync: false
      - key: TRANSLATION_CONTACT_EMAIL
        sync: false
      # ── النسخ الاحتياطي اليومي إلى Google Drive (البند 7) ──────────────
      # مهمّة النسخ الاحتياطي تعمل في العامل لا البوابة.
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_DRIVE_BACKUP_FOLDER_ID
        sync: false
      - key: BACKUP_RETENTION_COUNT
        sync: false
      - key: BACKUP_LOCAL_DIR
        sync: false
      # ── طبقة الدفع: اشتراك السائق الشهري فقط (البند 8) ──────────────────
      # العامل لا يستقبل ويبهوكاً ولا ينشئ فاتورة؛ يحتاج اسم المزوّد وحده لتسجيل
      # مصدر الدفعات في مهامّ الاشتراك، فلا تُمرَّر إليه مفاتيح Moyasar.
      - key: PAYMENT_PROVIDER
        sync: false
      - key: PAYMENT_ENVIRONMENT
        sync: false
      - key: ENABLE_DRIVER_SUBSCRIPTION
        sync: false
      # ── طبقة الخرائط والتوجيه (البند 9 والمرحلة 15) ──────────────────────
      # ‏ROUTING_PROVIDER: none افتراضاً. ضبطه على osrm يُلزم OSRM_BASE_URL،
      # وإلاّ مُنع الإقلاع — وهو أسلمُ من خدمةٍ موعودٍ بها وصامتة.
      - key: ROUTING_PROVIDER
        sync: false
      - key: OSRM_BASE_URL
        sync: false
      - key: MAP_STYLE_URL
        sync: false
      - key: MAP_PROVIDER
        sync: false
      - key: MAP_TILES_PUBLIC_KEY
        sync: false
      # ── طبقة التتبّع اللحظي (البند 9) ──────────────────────────────────────
      # كلّها اختياريّة: الغياب يعني افتراض المجال في packages/domain/geo/gps-fix.ts.
      # وكانت هذه الكتلة تحمل أسماءً لا وجود لها في .env.example ولا في الكود
      # (IDLE_INTERVAL بلا GPS_، MAX_SPEED بلا REASONABLE_) فمن ضبطها هنا ضبط
      # أسماءً لا يقرؤها أحد. الأسماء الآن موحَّدةٌ ومقروءةٌ، و scripts/check-env-drift.ts
      # يُسقط البناء إن عاد الانحراف.
      - key: TRACKING_GPS_INTERVAL_SECONDS
        sync: false
      - key: TRACKING_GPS_IDLE_INTERVAL_SECONDS
        sync: false
      - key: TRACKING_MIN_DISTANCE_METERS
        sync: false
      - key: TRACKING_TELEPORT_THRESHOLD_METERS
        sync: false
      - key: TRACKING_MAX_REASONABLE_SPEED_KMH
        sync: false
      - key: TRACKING_MAX_ACCURACY_METERS
        sync: false
      - key: TRACKING_MAX_TIME_DRIFT_SECONDS
        sync: false
      # ‏TRACKING_TOKEN_BASE_URL: أساسُ روابط التتبّع المُشارَكة (§4.2). غيابُه
      # يُطفئ ميزةَ الرابط صريحاً بلا كسر أيّ شيء آخر، ووجودُه يُلزم https في
      # الإنتاج. لا يُشتقّ من ترويسة الطلب أبداً — التفصيل في packages/shared/config.
      - key: TRACKING_TOKEN_BASE_URL
        sync: false
