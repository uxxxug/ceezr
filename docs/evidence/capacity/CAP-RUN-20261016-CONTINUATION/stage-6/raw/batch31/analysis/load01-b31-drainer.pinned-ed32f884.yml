name: LOAD-01 الدفعة 31 — مقعد 4 vCPU (ABBA بأربعة أذرع — اتصالات PostgreSQL في معالج تيليجرام)

# تشخيصٌ معزولٌ على فرعِ التجربةِ وحدَه ولا يُدمَج. PLAN-b31.md مثبَّتةٌ قبلَ أوّلِ موجة:
#   A=19e30b5b (main) · D=997b05d0 (A+الالتقاطُ المسبَق) · S=2ea1aa87 (ب30) · X=161890c8 (S+D) — gatewayRequest 5 في الأربعة.
on:
  push:
    branches: [exp/load01-b31-drainer]
    paths:
      - deploy/capacity-run/b24-runner/**
      - deploy/capacity-run/monitor/**
      - .github/workflows/load01-b31-drainer.yml

permissions:
  contents: read

concurrency:
  group: load01-b31-seat
  cancel-in-progress: false

jobs:
  seat:
    name: مقعد B31 (${{ matrix.series }})
    runs-on: ubuntu-26.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          - series: main
            limit: 50
            a_sha: 19e30b5bde50ffb9d47c63d7583bd1e8817498f0
            d_sha: 997b05d06210b73c635f42bd04d660c055089979
            s_sha: 2ea1aa87f49414396f5bb3699c0eb1c8a7d226b7
            x_sha: 161890c822872f180206698bd0ef267f485b7f92
            run_tag: main
    env:
      A_SHA: ${{ matrix.a_sha }}
      D_SHA: ${{ matrix.d_sha }}
      S_SHA: ${{ matrix.s_sha }}
      X_SHA: ${{ matrix.x_sha }}
      LIMIT: ${{ matrix.limit }}
      RUN_TAG: ${{ matrix.run_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: تجهيز المقعد (حزم المقعد الأصلي والمستخدم user)
        run: sudo bash deploy/capacity-run/b24-runner/provision-root.sh

      - name: نسخة المستودع للمستخدم user
        run: |
          sudo cp -a "$GITHUB_WORKSPACE" /home/user/workspace/ceezr
          sudo chown -R user:user /home/user/workspace/ceezr
          for X in "$A_SHA" "$D_SHA" "$S_SHA" "$X_SHA"; do sudo -u user git -C /home/user/workspace/ceezr cat-file -e "$X^{commit}"; done
          sudo -u user git -C /home/user/workspace/ceezr diff --stat "$A_SHA" "$D_SHA"
          sudo -u user git -C /home/user/workspace/ceezr diff --stat "$S_SHA" "$X_SHA"
          # فرقُ X عن S مطابقٌ بايتًا لفرقِ D عن A (وإلّا لا موجة)
          diff <(sudo -u user git -C /home/user/workspace/ceezr diff "$A_SHA" "$D_SHA") <(sudo -u user git -C /home/user/workspace/ceezr diff "$S_SHA" "$X_SHA") >/dev/null || { echo "X_MINUS_S_DIFFERS — لا موجة"; exit 1; }
          echo X_MINUS_S_EQUALS_D_MINUS_A

      - name: المقعد والموجات (داخل ceezrseat.slice)
        run: |
          MODE=$(cat deploy/capacity-run/b24-runner/MODE)
          echo "MODE=$MODE"
          sudo systemd-run --quiet --wait --pipe --collect --slice=ceezrseat.slice \
            --uid=user --gid=user -p LimitNOFILE=4096 -p WorkingDirectory=/home/user \
            --setenv=A_SHA="$A_SHA" --setenv=D_SHA="$D_SHA" --setenv=S_SHA="$S_SHA" --setenv=X_SHA="$X_SHA" --setenv=LIMIT="$LIMIT" --setenv=RUN_TAG="$RUN_TAG" \
            bash /home/user/workspace/ceezr/deploy/capacity-run/b24-runner/seat-b31.sh "$MODE"

      - name: رفع الدليل (لا يُرفعُ إلا بنجاحِ تدقيقِ الأسرارِ — الفشلُ يحجرُ الخامَّ في المقعدِ)
        uses: actions/upload-artifact@v5
        with:
          name: b31-seat-evidence-${{ matrix.run_tag }}
          path: /home/user/b31-out/
          if-no-files-found: warn
          retention-days: 14

      - name: رفع تقرير الفشل المنقح (تدقيقُ الأسرارِ وحدَه)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: b31-seat-failure-report-${{ matrix.run_tag }}
          path: /home/user/b31-out/secret-audit.txt
          if-no-files-found: ignore
          retention-days: 14
