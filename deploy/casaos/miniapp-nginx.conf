# الغرض: خادمُ Mini App الساكنةِ على CasaOS (ADR 0293) — يُركَّبُ في /etc/nginx/conf.d/default.conf
# للخدمةِ `miniapp`. الرؤوسُ منقولةٌ حرفيّاً من موقعِ Render الساكن (`render.yaml` → waslah-miniapp)،
# والبوابةُ ليست هنا: HAProxy يوجّهُ /v1 و/socket.io و/health إليها قبلَ هذا الخادم.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  add_header Content-Security-Policy "frame-ancestors https://telegram.org https://*.telegram.org" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  location /assets/ {
    add_header Content-Security-Policy "frame-ancestors https://telegram.org https://*.telegram.org" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # احتياطُ تطبيقِ الصفحةِ الواحدة: كلُّ مسارٍ غيرِ موجودٍ يُعادُ إلى index.html بلا تخزين.
  location / {
    add_header Content-Security-Policy "frame-ancestors https://telegram.org https://*.telegram.org" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
