# الغرض: خادمُ Mini App الساكنةِ على CasaOS (ADR 0293) — يُركَّبُ في /etc/nginx/conf.d/default.conf
# للخدمةِ `miniapp`. الرؤوسُ منقولةٌ حرفيّاً من موقعِ Render الساكن (`render.yaml` → waslah-miniapp)،
# والبوابةُ ليست هنا: HAProxy يوجّهُ /v1 و/socket.io و/health إليها قبلَ هذا الخادم.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  add_header Content-Security-Policy "frame-ancestors https://telegram.org https://*.telegram.org" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(self), payment=(), usb=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  # صفحةُ هبوطِ حملةِ تيك توك لزوّارِ المتصفّح (لا تمسُّ مسارَ Mini App الجذريّ).
  location = /start/ { absolute_redirect off; return 301 /start; }
  location = /start {
    default_type "text/html; charset=utf-8";
    add_header Content-Security-Policy "default-src 'none'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "public, max-age=300" always;
    return 200 '<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0a1633"><title>وَصْلَة | مشاويرك وتوصيل طلباتك من تيليجرام</title><meta name="description" content="وصلة تربط الراكب بالسائق مباشرة من داخل تيليجرام بلا وسيط. متاحة في جدة، مكة، الرياض، الطائف، والمدينة المنورة."><meta property="og:title" content="وَصْلَة — وصلناك، ووصلتنا"><meta property="og:description" content="اطلب مشوارك أو سجّل ككابتن مباشرة من تيليجرام."><link rel="icon" href="data:,"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/start.css?v=1"></head><body><div class="topbar" aria-hidden="true"></div><main><header class="brand"><a class="logo" href="/start" aria-label="وصلة — الصفحة الرئيسية"><b>وَصْلَة</b><small>WASLA</small></a><span class="pill">عبر تيليجرام · بلا وسيط</span></header><section class="hero"><h1>وصلناك، <span>ووصلتنا</span></h1><p>مشوارك أو طلب توصيلك على بُعد ضغطة واحدة من داخل تيليجرام — بدون تحميل تطبيقات، وتواصل مباشر بين الراكب والكابتن.</p></section><nav class="cta" aria-label="ابدأ مع وصلة"><a class="btn btn-rider" href="https://t.me/ODD_R_BOT" rel="noopener"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14l-1.5-5.5A2 2 0 0 0 15.6 10H8.4a2 2 0 0 0-1.9 1.5Z"/><path d="M3 17h18v2a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-.5H6v.5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><circle cx="7.5" cy="14.5" r=".6" fill="#fff"/><circle cx="16.5" cy="14.5" r=".6" fill="#fff"/><path d="M9 10 10 6h4l1 4"/></svg></span><span class="tx"><strong>اطلب مشوارك الآن</strong><em>للركاب · <bdi dir="ltr">@ODD_R_BOT</bdi></em></span><svg class="arr" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a><a class="btn btn-driver" href="https://t.me/ODD_D_BOT" rel="noopener"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.2"/><path d="M12 3v6.8M4.6 16.5l5.5-3.2M19.4 16.5l-5.5-3.2"/></svg></span><span class="tx"><strong>سجّل ككابتن الآن</strong><em>للسائقين · <bdi dir="ltr">@ODD_D_BOT</bdi></em></span><svg class="arr" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a><p class="hint">إذا لم يفتح تيليجرام تلقائياً، اختر «فتح في المتصفح» من قائمة الصفحة ثم اضغط الزر مرة أخرى.</p></nav><section class="feats" aria-label="مزايا وصلة"><div class="feat"><i>①</i>بدون وسيط</div><div class="feat"><i>②</i>من داخل تيليجرام</div><div class="feat"><i>③</i>دعم خطوة بخطوة</div></section><section class="cities" aria-labelledby="cities-title"><h2 id="cities-title">متواجدون الآن في</h2><ul><li>جدة</li><li>مكة</li><li>الرياض</li><li>الطائف</li><li>المدينة المنورة</li></ul></section></main><footer>© وَصْلَة · WASLA — مشاوير وتوصيل طلبات عبر تيليجرام</footer></body></html>';
  }
  location = /start.css {
    default_type "text/css; charset=utf-8";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "public, max-age=300" always;
    return 200 ':root{--navy:#0a1633;--navy-2:#0f2147;--royal:#1d4fd8;--tg:#2aa3e0;--orange:#ff7a00;--orange-2:#ff9a2e;--ink:#f4f7ff;--muted:#a9b6d6;--line:rgba(120,160,255,.22)}*{box-sizing:border-box;margin:0;padding:0}html{-webkit-text-size-adjust:100%}body{min-height:100svh;font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:var(--ink);background:var(--navy);line-height:1.6;background-image:radial-gradient(120% 60% at 100% 0%,rgba(29,79,216,.55) 0%,transparent 60%),radial-gradient(90% 50% at 0% 100%,rgba(255,122,0,.18) 0%,transparent 60%);display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}.topbar{height:6px;background:linear-gradient(90deg,var(--orange),var(--orange-2) 40%,var(--tg))}main{width:100%;max-width:30rem;margin:0 auto;padding:2rem 1.25rem 1.5rem;flex:1;display:flex;flex-direction:column;gap:1.75rem}.brand{display:flex;align-items:center;justify-content:space-between;gap:1rem}.logo{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;background:var(--orange);color:#fff;border-radius:18px;padding:.45rem 1.15rem .35rem;border:2px solid rgba(255,255,255,.85);box-shadow:0 10px 30px -10px rgba(255,122,0,.7);text-decoration:none;line-height:1.1}.logo b{font-size:2rem;font-weight:800;letter-spacing:0}.logo small{font-size:.62rem;font-weight:800;letter-spacing:.18em;color:var(--navy);direction:ltr}.pill{font-size:.8rem;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:.35rem .8rem;background:rgba(15,33,71,.6)}.hero h1{font-size:clamp(2rem,8.5vw,2.6rem);font-weight:800;line-height:1.25}.hero h1 span{color:var(--orange-2)}.hero p{margin-top:.75rem;font-size:1.08rem;color:var(--muted)}.cta{display:grid;gap:1rem}.btn{display:flex;align-items:center;gap:1rem;text-decoration:none;color:#fff;border-radius:22px;padding:1.15rem 1.2rem;min-height:5.25rem;transition:transform .15s ease,box-shadow .15s ease,filter .15s ease;-webkit-tap-highlight-color:#0000}.btn:active{transform:scale(.98)}.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}.btn .ic{flex:none;width:3.1rem;height:3.1rem;border-radius:16px;display:grid;place-items:center;background:rgba(255,255,255,.18)}.btn .ic svg{width:1.7rem;height:1.7rem}.btn .tx{flex:1;display:flex;flex-direction:column}.btn .tx strong{font-size:1.35rem;font-weight:800;line-height:1.3}.btn .tx em bdi{white-space:nowrap;font-weight:700}.btn .tx em{font-style:normal;font-size:.9rem;opacity:.9;font-weight:500}.btn .arr{flex:none;width:1.4rem;height:1.4rem;opacity:.9}.btn-rider{background:linear-gradient(135deg,var(--orange) 0%,var(--orange-2) 100%);box-shadow:0 16px 36px -14px rgba(255,122,0,.85)}.btn-driver{background:linear-gradient(135deg,var(--royal) 0%,var(--tg) 100%);box-shadow:0 16px 36px -14px rgba(42,163,224,.8)}@media (hover:hover){.btn:hover{transform:translateY(-2px);filter:brightness(1.06)}}.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}.feat{border:1px solid var(--line);background:rgba(15,33,71,.65);border-radius:16px;padding:.8rem .4rem;text-align:center;font-size:.86rem;font-weight:700;line-height:1.35}.feat i{display:block;font-style:normal;color:var(--orange-2);font-size:1.15rem;margin-bottom:.15rem}.cities{border:1px solid rgba(255,122,0,.45);border-radius:18px;padding:1rem;background:rgba(10,22,51,.7);text-align:center}.cities h2{font-size:.95rem;font-weight:700;color:var(--muted);margin-bottom:.5rem}.cities ul{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;gap:.4rem .5rem}.cities li{font-weight:800;color:var(--orange-2);font-size:1rem;padding:.15rem .7rem;border-radius:999px;background:rgba(255,122,0,.1)}.hint{font-size:.82rem;color:var(--muted);text-align:center}footer{text-align:center;font-size:.8rem;color:var(--muted);padding:1rem 1.25rem 1.5rem}';
  }


  location /assets/ {
    add_header Content-Security-Policy "frame-ancestors https://telegram.org https://*.telegram.org" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # احتياطُ تطبيقِ الصفحةِ الواحدة: كلُّ مسارٍ غيرِ موجودٍ يُعادُ إلى index.html بلا تخزين.
  location / {
    add_header Content-Security-Policy "frame-ancestors https://telegram.org https://*.telegram.org" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
