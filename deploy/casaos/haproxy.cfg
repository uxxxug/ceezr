# الغرض: موزِّعُ نسختَي البوابةِ على خادمِ CasaOS (ADR 0292 §٣-٤) وبابُها العامُّ (ADR 0293).
# ينتمي إلى: deploy/casaos — يُركَّبُ في /opt/wasla/haproxy.cfg ويقرؤه الخدمةُ `lb` في compose.
#
# - فحصٌ نشطٌ لـ/ready: النسخةُ المُصرِّفةُ (503) تخرجُ من التوزيعِ فوراً.
# - /socket.io/ لاصقٌ بتجزئةِ Cf-Connecting-Ip (ورجوعٌ إلى عنوانِ المصدر): المحادثةُ
#   `transports:["polling"]` ومعرّفُ جلسةِ Engine.IO محلّيٌّ للنسخة.
# - بقيّةُ المساراتِ leastconn — لا حالةَ في النسخة (الجلساتُ في Redis والحقيقةُ في القاعدة).
# - واجهتان:
#   * `gateway_front` (:8080، منشورٌ على 127.0.0.1 للمشغِّلِ وحدَه) — كلُّ المساراتِ كما كانت،
#     ومنها /admin و/metrics عبرَ نفقِ SSH.
#   * `public_front` (:8443، منشورٌ على 127.0.0.1 ولا يصلُه إلّا cloudflared) — بابُ الإنترنت:
#     قائمةٌ بيضاءُ لمساراتِ البوابة، وكلُّ ما سواها Mini App الساكنة. /internal و/metrics
#     و/admin مرفوضةٌ (403) قبلَ أن تبلغَ أيَّ نسخة.

global
  log stdout format raw local0 warning
  maxconn 8192

defaults
  log global
  mode http
  option httplog
  option forwardfor if-none
  option redispatch
  retries 2
  timeout connect 5s
  timeout client 60s
  timeout server 60s
  # WebSocket للوحةِ العروضِ وقناةِ الرحلة: نفقٌ طويلٌ لا مهلةُ طلب.
  timeout tunnel 1h
  timeout http-keep-alive 10s

frontend gateway_front
  bind :8080
  http-request set-var(txn.client) req.hdr(Cf-Connecting-Ip) if { req.hdr(Cf-Connecting-Ip) -m found }
  http-request set-var(txn.client) src unless { var(txn.client) -m found }
  use_backend gateways_sticky if { path_beg /socket.io/ }
  default_backend gateways

frontend public_front
  bind :8443
  # لا يدخلُ هنا إلّا ما مرَّ بحافّةِ Cloudflare، وهي تضبطُ Cf-Connecting-Ip وتطمسُ ما يرسلُه
  # العميل. فيُفرَضُ منه X-Forwarded-For (مفتاحُ حدِّ المعدَّلِ في البوابة: أوّلُ قيمة) ولا
  # يُقبَلُ ما يدّعيه العميل. وغيابُه يعني طلباً لم يمرَّ بالحافّة ⇒ رفض.
  http-request deny deny_status 403 unless { req.hdr(Cf-Connecting-Ip) -m found }
  http-request set-header X-Forwarded-For %[req.hdr(Cf-Connecting-Ip)]
  http-request set-var(txn.client) req.hdr(Cf-Connecting-Ip)
  acl internal_path path_beg /internal/ /internal /metrics /admin
  http-request deny deny_status 403 if internal_path
  acl gateway_path path_beg /v1/ /webhook/telegram/ /track/ /api/track/
  acl gateway_path path /health /ready
  use_backend gateways_sticky if { path_beg /socket.io/ }
  use_backend gateways if gateway_path
  default_backend miniapp

backend gateways
  balance leastconn
  option httpchk GET /ready
  http-check expect status 200
  default-server inter 2s fall 2 rise 2
  server gateway-1 gateway-1:8080 check
  server gateway-2 gateway-2:8080 check

backend gateways_sticky
  balance hash var(txn.client)
  hash-type consistent
  option httpchk GET /ready
  http-check expect status 200
  default-server inter 2s fall 2 rise 2
  server gateway-1 gateway-1:8080 check
  server gateway-2 gateway-2:8080 check

backend miniapp
  option httpchk GET /index.html
  http-check expect status 200
  default-server inter 5s fall 2 rise 2
  server miniapp miniapp:8080 check
