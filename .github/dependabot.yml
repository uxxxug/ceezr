# Dependabot — فحصُ اعتمادياتٍ آليٌّ (D-09)
#
# يُغطّي ثلاثةَ أنظمةٍ بيئيّةٍ:
# 1. npm — جذرُ المشروعِ و`apps/miniapp`
# 2. github-actions — تحديثُ إجراءاتِ CI
# 3. docker — صورُ `docker/upstash-rest-shim/Dockerfile`
#
# الجدولةُ: أسبوعيّاً (الاثنين) لتقليلِ الضوضاءِ معَ تغطيةٍ منتظمةٍ.
# لا يُفتحُ التحديثُ تلقائيًّا — يُنشِئُ PR ينتظرُ المراجعةَ والفحصَ.
#
# **قيدٌ بنيويٌّ مُقيسٌ (ADR 0142):** Dependabot لا يُحدِّثُ `bun.lock`، ووظيفةُ
# `verify` تبدأُ بـ`bun install --frozen-lockfile` — فكلُّ طلبٍ يفتحُه يُولَدُ أحمرَ.
# والمعالجةُ آليّةٌ في `.github/workflows/dependabot-lockfile.yml`: يُعيدُ توليدَ
# القفلِ على الفرعِ ويدفعُه ثمَّ يستدعي CI. **ولم يُخفَّفْ `--frozen-lockfile`.**

version: 2

updates:
  # npm — جذرُ المشروعِ
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
      - npm

  # npm — تطبيقُ المُصغَّرِ
  - package-ecosystem: npm
    directory: /apps/miniapp
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps-miniapp)
    labels:
      - dependencies
      - npm
    # **تجاهلُ إصدارَينِ رئيسَينِ بقرارٍ مكتوبٍ لا بضجرٍ من الأحمرِ (ADR 0142 §٥):**
    # `vite@8` يستبدلُ الجامعَ من Rollup إلى Rolldown، و`@vitejs/plugin-react@6`
    # يشترطُ `vite ^8.0.0` في `peerDependencies` — فالاثنانِ صفقةٌ واحدةٌ لا بندانِ.
    # وقد قِيسَ أثرُهما على مُخرَجِ البناءِ فعلاً في هذه الوحدةِ وسقطَت بوّابةُ
    # ميزانيةِ الأداءِ (القسم 9.9 · `F1-09`): صفرُ حزمةٍ مؤجَّلةٍ · 10 طلباتٍ لأوّلِ
    # رسمٍ والحدُّ 6 · 199.4 KB حملاً أوّلَ. أي أنَّ حزمةَ السائقِ تُنزَّلُ للراكبِ.
    # والتفصيلُ ومسارُ الهجرةِ المقيسُ في `docs/evidence/toolchain/D-09-20260917.md`.
    # **وهذا تأجيلٌ لبندِ خارطةٍ مُسجَّلٍ لا إسقاطٌ للتحديثِ**؛ يُرفَعُ التجاهلُ حينَ
    # يُنفَّذُ بندُ هجرةِ الجامعِ ويصيرُ القياسُ أخضرَ بلا تخفيفِ ميزانيةٍ.
    ignore:
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]

  # GitHub Actions — تحديثُ إجراءاتِ CI
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(ci-deps)
    labels:
      - dependencies
      - github-actions

  # Docker — صورُ الحاويات
  - package-ecosystem: docker
    directory: /docker/upstash-rest-shim
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(docker-deps)
    labels:
      - dependencies
      - docker
