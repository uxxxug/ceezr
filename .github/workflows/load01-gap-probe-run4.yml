name: LOAD-01-GAP-PROBE-RUN4 · بوابة A/A على ttfbResid (مقعد 4 vCPU)

# تجربةٌ تشخيصيّةٌ على فرعِ القياسِ وحدَه ولا تُدمَجُ نتائجُها حكمَ سعة. PROTOCOL-load01-gap-probe-run4.md مثبَّتٌ
# على فرعِ القياسِ قبلَ أيِّ موجة. ستُّ موجاتٍ كحدٍّ أقصى على الالتزامِ نفسِه A‴ (الذراعُ ذاتُه كما في RUN3 —
# لا كودَ يشغّلُه المقعدُ تغيّر)، والفرقُ الوحيدُ عن RUN3: بوابةُ A/A تُقاسُ على ttfbResid = ttfbMs − queueWaitMs
# (الخيارُ المسجَّلُ في §9 من بروتوكولِ RUN3) بدلَ ttfbMs الخامِ الذي شملَ تذبذبَ المولّدِ نفسِه.
# S = LOAD_GEN_FETCH_CAP=256، N = غيرُ مضبوط. AA1/AA2 (S، 70/71) ← q ← بوابةُ aa4 ← S1 N1 N2 S2 (71–74)
# ← بوابتا الكلفةِ وتكافؤِ الحمل. لا رفعَ لحدِّ Bun؛ gatewayRequest 5 وIMMEDIATE_REDISPATCH_LIMIT 50 دونَ تغيير.
# لا قاعدةَ إنتاج، لا Render، لا تيليجرامَ حقيقي.

on:
  push:
    branches: [exp/load01-gap-probe-run4]
    paths:
      - deploy/capacity-run/b24-runner/seat-load01-gap-probe-run4.sh
      - deploy/capacity-run/b24-runner/gap4-analyze.py
      - deploy/capacity-run/b24-runner/gap4-analyze-selftest.py
      - docs/evidence/capacity/LOAD01-GAP-PROBE-RUN4-20261027/PROTOCOL-load01-gap-probe-run4.md
      - .github/workflows/load01-gap-probe-run4.yml

permissions:
  contents: read

env:
  # A_SHA = A‴ = A″ (0d3ae995) + سيمافورُ المولّدِ واختباراتُه وحدَها (ذراعُ RUN3 نفسُه — RUN4 أداةُ تحليلٍ لا كودَ مقعد)؛
  # A2_SHA = A″ لفحصِ الفرق.
  A_SHA: 63bc7b0fbe42a1b02a02af5c7a6bed7f3f785a50
  A2_SHA: 0d3ae995434869cbcd1854d2d40b4d1d81c2c383
  MIXED_RATE: "20"
  MIXED_SEED: "1"

jobs:
  seat:
    name: "gap-probe-run4 (≤6 waves, same arm as RUN3, aa4 on ttfbResid)"
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: تجهيز المقعد
        run: sudo bash deploy/capacity-run/b24-runner/provision-root.sh

      - name: نسخة المستودع للمستخدم user
        run: |
          sudo cp -a "$GITHUB_WORKSPACE" /home/user/workspace/ceezr
          sudo chown -R user:user /home/user/workspace/ceezr
          for X in "$A_SHA" "$A2_SHA"; do sudo -u user git -C /home/user/workspace/ceezr cat-file -e "$X^{commit}"; done

      - name: المقعد والموجات (داخل ceezrseat.slice)
        run: |
          sudo systemd-run --quiet --wait --pipe --collect --slice=ceezrseat.slice \
            --uid=user --gid=user -p LimitNOFILE=65536 -p WorkingDirectory=/home/user \
            --setenv=A_SHA="$A_SHA" --setenv=A2_SHA="$A2_SHA" --setenv=IMAGE_OS="${ImageOS:-}" --setenv=IMAGE_VERSION="${ImageVersion:-}" --setenv=MIXED_RATE="$MIXED_RATE" --setenv=MIXED_SEED="$MIXED_SEED" --setenv=CONC="1500" --setenv=CITIES="JED,MKK,RUH,TIF,MED" \
            bash /home/user/workspace/ceezr/deploy/capacity-run/b24-runner/seat-load01-gap-probe-run4.sh

      # قرارُ الرفعِ منَ تدقيقٍ نهائيٍّ جديدٍ بعدَ انتهاءِ المقعدِ (دائمًا) يُبطلُ أيَّ تصريحٍ
      # سابقٍ — علامةُ بوابةٍ أو ختامٍ سابقٍ لا تُجيزُ رفعَ محتوىً لاحقٍ لم يجتزْ تدقيقًا.
      - name: التدقيق النهائي وقرار الرفع
        id: gatecheck
        if: always()
        env:
          PROBE_OUT: /home/user/load01gap-run4-out
          PROBE_SECRETS: /srv/ceezr-cap-20261016/secrets.env
          PROBE_AUDIT_PY: /home/user/workspace/ceezr/deploy/capacity-run/b24-runner/seat-bin/b24-secret-audit.py
          PROBE_FINAL: /home/user/workspace/ceezr/deploy/capacity-run/b24-runner/probe-final-audit.sh
        run: |
          set +e
          # إبطالُ أيِّ تصريحٍ سابقٍ في خطوةِ الاستدعاءِ نفسِها قبلَ أيِّ شيءٍ آخر —
          # فلا تنجوَ علامةٌ قديمةٌ ولو تعذّرَ تشغيلُ البرنامجِ النهائيِّ نفسُه.
          sudo rm -f "$PROBE_OUT/AUDIT_PASSED"
          sudo bash "$PROBE_FINAL" "$PROBE_OUT" "$PROBE_SECRETS" "$PROBE_AUDIT_PY"
          RC=$?
          set -e
          # الافتراضي تقريرٌ منقَّحٌ؛ الرفعُ الكاملُ لا يجوزُ إلا برمزِ 0 **و** علامةٍ جديدةٍ
          if [ "$RC" -eq 0 ] && [ -f "$PROBE_OUT/AUDIT_PASSED" ]; then
            MODE=evidence
          else
            MODE=report
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          # تقريرُ حالةٍ منقَّحٌ جديدٌ لهذهِ المحاولةِ نفسِها — مستقلٌّ عنْ قدرةِ البرنامجِ
          # النهائيِّ على البدءِ (يتضمّنُ رمزَ الخروجِ وهلْ أُنتجَ تقريرُهُ)؛ لا يُنسخُ فيهِ
          # مخرجاتٌ عشوائيةٌ قد تحملُ أسرارًا — أرقامٌ وقرارٌ فقط.
          printf 'final_audit_exit=%s\nfinal_report_produced=%s\ndecision=%s\ndate_utc=%s\n' \
            "$RC" "$([ -s "$PROBE_OUT/final-secret-audit.txt" ] && echo yes || echo no)" "$MODE" "$(date -Is)" \
            | sudo tee "$PROBE_OUT/final-audit-status.txt" >/dev/null
          # إخفاقُ التدقيقِ النهائيِّ إخفاقٌ في حالةِ التشغيلِ (خطواتُ الرفعِ تعملُ دائمًا)
          exit $RC

      # الدليلُ يُرفعُ في مساري النجاحِ والتوقفِ المُوثَّقِ كليهما إذا اجتازَ المحتوى النهائيُّ
      # تدقيقَ الأسرارِ (AUDIT_PASSED) — فتوقُّفُ البوابةِ نتيجةٌ تشخيصيةٌ تُحفظُ لا تُستبدلُ؛
      # وعندَ إخفاقِ التدقيقِ لا يُرفعُ إلا التقريرُ المنقَّحُ (الأثرُ الخامُ سقطَ في المقعدِ).
      - name: رفع الدليل (نجاحٌ أو توقفٌ موثَّقٌ بعد تدقيقٍ نظيف)
        if: always() && steps.gatecheck.outputs.mode == 'evidence'
        uses: actions/upload-artifact@v5
        with:
          name: load01gap-run4
          path: /home/user/load01gap-run4-out/
          if-no-files-found: warn
          retention-days: 30

      - name: رفع تقرير الفشل المنقح (تقريرُ التدقيقِ النهائيِّ أولًا)
        if: always() && steps.gatecheck.outputs.mode == 'report'
        uses: actions/upload-artifact@v5
        with:
          name: load01gap-run4-failure-report
          path: |
            /home/user/load01gap-run4-out/final-audit-status.txt
            /home/user/load01gap-run4-out/final-secret-audit.txt
            /home/user/load01gap-run4-out/secret-audit.txt
          if-no-files-found: ignore
