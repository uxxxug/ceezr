name: LOAD-01 · C2 — مقارنة مقترنة (مقعد 4 vCPU)

# تجربةُ قياسٍ على فرعِ القياسِ وحدَه ولا تُدمَج. PROTOCOL-load01-c2-contact-ab.md مثبَّتٌ في الالتزامِ نفسِه قبلَ أوّلِ موجة.
#   التصميم: كلُّ ذراعٍ يُشغَّلُ من شيفرتِه عبرَ مسارِ cand الواحدِ نفسِه (wt-acc يُبدَّلُ التزامُه قبلَ كلِّ موجة):
#   موجةُ A = بوّابةٌ من شيفرةِ A (main قبلَ C2)، وموجةُ B = بوّابةٌ من شيفرةِ B (فرعُ C2). القالبانِ متطابقانِ
#   (C2 بلا هجرات) والبصمةُ واحدةٌ يتحققُ منها حارسُ السكربتِ حرفيًّا.
#   تسبقُهما موجتا تحقّقٍ S1/S2 عندَ conc=100 لا تدخلانِ الحكمَ، وإن فشلت إحداهما توقفَ التشغيلُ قبلَ الموجاتِ الثماني.
#   gatewayRequest 5 وIMMEDIATE_REDISPATCH_LIMIT 50 دونَ تغيير. لا قاعدةَ إنتاج، لا Render، لا تيليجرامَ حقيقي.

on:
  push:
    branches: [exp/load01-c2-contact-ab]
    paths:
      - deploy/capacity-run/b24-runner/seat-load01-c2-contact-ab.sh
      - deploy/capacity-run/b24-runner/PROTOCOL-load01-c2-contact-ab.md
      - .github/workflows/load01-c2-contact-ab.yml

permissions:
  contents: read

env:
  # PROTOCOL-load01-c2-contact-ab.md §2: A = main قبلَ C2؛ B = فرعُ C2 (رأسُ perf/load01-c2-contact-merged-read).
  A_SHA: 4bd9432ea38542c2d6e1f24eb3f7417d93fbca20
  B_SHA: d7eb7d5a4d9c5eb1882b369aee27685ccc4ba94e
  REF_SHA: d7eb7d5a4d9c5eb1882b369aee27685ccc4ba94e
  MIXED_RATE: "20"
  MIXED_SEED: "1"

jobs:
  seat:
    name: "c2-contact-ab (scenarios=1500, cities=5)"
    runs-on: ubuntu-26.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: تجهيز المقعد
        run: sudo bash deploy/capacity-run/b24-runner/provision-root.sh

      - name: نسخة المستودع للمستخدم user
        run: |
          sudo cp -a "$GITHUB_WORKSPACE" /home/user/workspace/ceezr
          sudo chown -R user:user /home/user/workspace/ceezr
          for X in "$A_SHA" "$B_SHA" "$REF_SHA"; do sudo -u user git -C /home/user/workspace/ceezr cat-file -e "$X^{commit}"; done

      - name: المقعد والموجات (داخل ceezrseat.slice)
        run: |
          sudo systemd-run --quiet --wait --pipe --collect --slice=ceezrseat.slice \
            --uid=user --gid=user -p LimitNOFILE=65536 -p WorkingDirectory=/home/user \
            --setenv=A_SHA="$A_SHA" --setenv=B_SHA="$B_SHA" --setenv=REF_SHA="$REF_SHA" --setenv=MIXED_RATE="$MIXED_RATE" --setenv=MIXED_SEED="$MIXED_SEED" --setenv=CONC="1500" --setenv=SMOKE_CONC="100" --setenv=CITIES="JED,MKK,RUH,TIF,MED" \
            bash /home/user/workspace/ceezr/deploy/capacity-run/b24-runner/seat-load01-c2-contact-ab.sh

      - name: رفع الدليل (لا يُرفعُ إلا بنجاحِ تدقيقِ الأسرار)
        uses: actions/upload-artifact@v5
        with:
          name: load01c2-contact-ab
          path: /home/user/load01c2-out/
          if-no-files-found: warn
          retention-days: 30

      - name: رفع تقرير الفشل المنقح (تدقيقُ الأسرارِ وحدَه)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: load01c2-contact-ab-failure-report
          path: /home/user/load01c2-out/secret-audit.txt
          if-no-files-found: ignore
