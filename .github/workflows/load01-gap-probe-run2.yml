name: LOAD-01-GAP-PROBE-RUN2 · قياس فجوة الكمون خارج الجسر (مقعد 4 vCPU)

# تجربةُ قياسٍ على فرعِ القياسِ وحدَه ولا تُدمَجُ نتائجُها حكمًا. PROTOCOL-load01-gap-probe-run2.md مثبَّتٌ
# على فرعِ القياسِ قبلَ أيِّ موجة. ستُّ موجاتٍ كحدٍّ أقصى في وظيفةٍ واحدة: AA1/AA2 (70/71) ← بوابةُ aa2
# ← COST ON–OFF–OFF–ON (71–74) ← بوابةُ الكلفة (probe-analyze cost دونَ تغيير). لا ABBA ولا حكمَ B−A.
# gatewayRequest 5 وIMMEDIATE_REDISPATCH_LIMIT 50 دونَ تغيير. لا قاعدةَ إنتاج، لا Render، لا تيليجرامَ حقيقي.

on:
  push:
    branches: [exp/load01-gap-probe-run2]
    paths:
      - deploy/capacity-run/b24-runner/seat-load01-gap-probe-run2.sh
      - deploy/capacity-run/b24-runner/gap2-analyze.py
      - deploy/capacity-run/b24-runner/gap2-analyze-selftest.py
      - docs/evidence/capacity/LOAD01-GAP-PROBE-RUN2-20261027/PROTOCOL-load01-gap-probe-run2.md
      - .github/workflows/load01-gap-probe-run2.yml

permissions:
  contents: read

env:
  # A_SHA = A″ = A′ (3bead327، ذراعُ RUN1) + أدواتُ RUN2؛ A1_SHA = A′ لفحصِ أنَّ الفرقَ أدواتُ RUN2 وحدَها؛
  # OFF = ذراعُ C2 ‏A بلا أيِّ أداةِ فجوة (30c9dae6).
  A_SHA: 0d3ae995434869cbcd1854d2d40b4d1d81c2c383
  A1_SHA: 3bead32764ab0dd632aa9e1eebb7eb1aa29d693b
  OFF_SHA: 30c9dae6110b522628f8ac7e3194c92eb40952fd
  MIXED_RATE: "20"
  MIXED_SEED: "1"

jobs:
  seat:
    name: "gap-probe-run2 (≤6 waves, gates first, no ABBA)"
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: تجهيز المقعد
        run: sudo bash deploy/capacity-run/b24-runner/provision-root.sh

      - name: نسخة المستودع للمستخدم user
        run: |
          sudo cp -a "$GITHUB_WORKSPACE" /home/user/workspace/ceezr
          sudo chown -R user:user /home/user/workspace/ceezr
          for X in "$A_SHA" "$A1_SHA" "$OFF_SHA"; do sudo -u user git -C /home/user/workspace/ceezr cat-file -e "$X^{commit}"; done

      - name: المقعد والموجات (داخل ceezrseat.slice)
        run: |
          sudo systemd-run --quiet --wait --pipe --collect --slice=ceezrseat.slice \
            --uid=user --gid=user -p LimitNOFILE=65536 -p WorkingDirectory=/home/user \
            --setenv=A_SHA="$A_SHA" --setenv=A1_SHA="$A1_SHA" --setenv=OFF_SHA="$OFF_SHA" --setenv=IMAGE_OS="${ImageOS:-}" --setenv=IMAGE_VERSION="${ImageVersion:-}" --setenv=MIXED_RATE="$MIXED_RATE" --setenv=MIXED_SEED="$MIXED_SEED" --setenv=CONC="1500" --setenv=CITIES="JED,MKK,RUH,TIF,MED" \
            bash /home/user/workspace/ceezr/deploy/capacity-run/b24-runner/seat-load01-gap-probe-run2.sh

      # قرارُ الرفعِ منَ تدقيقٍ نهائيٍّ جديدٍ بعدَ انتهاءِ المقعدِ (دائمًا) يُبطلُ أيَّ تصريحٍ
      # سابقٍ — علامةُ بوابةٍ أو ختامٍ سابقٍ لا تُجيزُ رفعَ محتوىً لاحقٍ لم يجتزْ تدقيقًا.
      - name: التدقيق النهائي وقرار الرفع
        id: gatecheck
        if: always()
        env:
          PROBE_OUT: /home/user/load01gap-run2-out
          PROBE_SECRETS: /srv/ceezr-cap-20261016/secrets.env
          PROBE_AUDIT_PY: /home/user/workspace/ceezr/deploy/capacity-run/b24-runner/seat-bin/b24-secret-audit.py
          PROBE_FINAL: /home/user/workspace/ceezr/deploy/capacity-run/b24-runner/probe-final-audit.sh
        run: |
          set +e
          # إبطالُ أيِّ تصريحٍ سابقٍ في خطوةِ الاستدعاءِ نفسِها قبلَ أيِّ شيءٍ آخر —
          # فلا تنجوَ علامةٌ قديمةٌ ولو تعذّرَ تشغيلُ البرنامجِ النهائيِّ نفسُهُ.
          sudo rm -f "$PROBE_OUT/AUDIT_PASSED"
          sudo bash "$PROBE_FINAL" "$PROBE_OUT" "$PROBE_SECRETS" "$PROBE_AUDIT_PY"
          RC=$?
          set -e
          # الافتراضي تقريرٌ منقَّحٌ؛ الرفعُ الكاملُ لا يجوزُ إلا برمزِ 0 **و** علامةٍ جديدةٍ
          if [ "$RC" -eq 0 ] && [ -f "$PROBE_OUT/AUDIT_PASSED" ]; then
            MODE=evidence
          else
            MODE=report
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          # تقريرُ حالةٍ منقَّحٌ جديدٌ لهذهِ المحاولةِ نفسِها — مستقلٌّ عنْ قدرةِ البرنامجِ
          # النهائيِّ على البدءِ (يتضمّنُ رمزَ الخروجِ وهلْ أُنتجَ تقريرُهُ)؛ لا يُنسخُ فيهِ
          # مخرجاتٌ عشوائيةٌ قد تحملُ أسرارًا — أرقامٌ وقرارٌ فقط.
          printf 'final_audit_exit=%s\nfinal_report_produced=%s\ndecision=%s\ndate_utc=%s\n' \
            "$RC" "$([ -s "$PROBE_OUT/final-secret-audit.txt" ] && echo yes || echo no)" "$MODE" "$(date -Is)" \
            | sudo tee "$PROBE_OUT/final-audit-status.txt" >/dev/null
          # إخفاقُ التدقيقِ النهائيِّ إخفاقٌ في حالةِ التشغيلِ (خطواتُ الرفعِ تعملُ دائمًا)
          exit $RC

      # الدليلُ يُرفعُ في مساري النجاحِ والتوقفِ المُوثَّقِ كليهما إذا اجتازَ المحتوى النهائيُّ
      # تدقيقَ الأسرارِ (AUDIT_PASSED) — فتوقُّفُ البوابةِ نتيجةٌ تشخيصيةٌ تُحفظُ لا تُستبدلُ؛
      # وعندَ إخفاقِ التدقيقِ لا يُرفعُ إلا التقريرُ المنقَّحُ (الأثرُ الخامُ سقطَ في المقعدِ).
      - name: رفع الدليل (نجاحٌ أو توقفٌ موثَّقٌ بعد تدقيقٍ نظيف)
        if: always() && steps.gatecheck.outputs.mode == 'evidence'
        uses: actions/upload-artifact@v5
        with:
          name: load01gap-run2
          path: /home/user/load01gap-run2-out/
          if-no-files-found: warn
          retention-days: 30

      - name: رفع تقرير الفشل المنقح (تقريرُ التدقيقِ النهائيِّ أولًا)
        if: always() && steps.gatecheck.outputs.mode == 'report'
        uses: actions/upload-artifact@v5
        with:
          name: load01gap-run2-failure-report
          path: |
            /home/user/load01gap-run2-out/final-audit-status.txt
            /home/user/load01gap-run2-out/final-secret-audit.txt
            /home/user/load01gap-run2-out/secret-audit.txt
          if-no-files-found: ignore
