name: LOAD-01M — المدن الخمس المتزامنة (هدفٌ مكمِّلٌ لـLOAD-01، مقعد 4 vCPU)

# تجربةُ قياسٍ على فرعِ القياسِ وحدَه ولا تُدمَج. PROTOCOL-load01m.md مثبَّتٌ في الالتزامِ نفسِه قبلَ أوّلِ موجة.
#   الدورةُ الثالثة: الذراعانِ A/B على المشغِّلِ نفسِه (seat-load01m-ab.sh، PROTOCOL-load01m-ab.md) لأنّ المقارنةَ
#   عبرَ مشغِّلاتٍ مختلفةِ العتادِ غيرُ صالحة (LOAD01M-DRAINER-DECOMPOSE-20261024). gatewayRequest 5 وIMMEDIATE_REDISPATCH_LIMIT 50 دونَ تغيير.
#   لا قاعدةَ إنتاج، لا Render، لا تيليجرامَ حقيقي.
on:
  push:
    branches: [exp/load01m-5city]
    paths:
      - deploy/capacity-run/b24-runner/**
      - deploy/capacity-run/monitor/drainer-decompose.ts
      - deploy/capacity-run/monitor/job-timeline.ts
      - .github/workflows/load01m-5city.yml

permissions:
  contents: read

env:
  # الدورةُ الثالثة (PROTOCOL-load01m-ab.md): مقارنةٌ مقترنةٌ على مشغِّلٍ واحد، ABBA×2، الفرقُ الوحيدُ قالبُ القاعدة.
  # A = خطُّ الأساس (main 2d53ad55 + أدواتُ القياس) — نفسُ التزامِ موجةِ 40072049298.
  A_SHA: f9f598c28e48779d9bdda1fea52f2d8d1c3bacc2
  # B = #647 (main 2559a742 + الأدواتُ نفسُها) — نفسُ التزامِ موجةِ 40093933836.
  B_SHA: c7e63971af42084f36c9b6d80f734d7d6ea7a21e
  # الدورةُ الرابعة (PROTOCOL-load01m-mixed.md): REF = B + قياسُ زمنِ كلِّ وظيفةٍ وحدَه، يشغّلُ البوّابةَ والمولّدَين للذراعين؛
  # وحِملٌ مختلطٌ ثابتٌ لبوتِ السائق (20/ث، command:message = 1:1، بذرة 1) بجوارِ m5-1500.
  REF_SHA: bca1c743289bb780af96afcff49900a1f78e7e8c
  MIXED_RATE: "20"
  MIXED_SEED: "1"

jobs:
  seat:
    name: "${{ matrix.name }} (scenarios=${{ matrix.conc }}, cities=${{ matrix.cities }})"
    runs-on: ubuntu-26.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: m5-1500-mixed, conc: 1500, cities: "JED,MKK,RUH,TIF,MED" }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: تجهيز المقعد
        run: sudo bash deploy/capacity-run/b24-runner/provision-root.sh

      - name: نسخة المستودع للمستخدم user
        run: |
          sudo cp -a "$GITHUB_WORKSPACE" /home/user/workspace/ceezr
          sudo chown -R user:user /home/user/workspace/ceezr
          for X in "$A_SHA" "$B_SHA" "$REF_SHA"; do sudo -u user git -C /home/user/workspace/ceezr cat-file -e "$X^{commit}"; done

      - name: المقعد والموجة (داخل ceezrseat.slice)
        run: |
          sudo systemd-run --quiet --wait --pipe --collect --slice=ceezrseat.slice \
            --uid=user --gid=user -p LimitNOFILE=65536 -p WorkingDirectory=/home/user \
            --setenv=A_SHA="$A_SHA" --setenv=B_SHA="$B_SHA" --setenv=REF_SHA="$REF_SHA" --setenv=MIXED_RATE="$MIXED_RATE" --setenv=MIXED_SEED="$MIXED_SEED" --setenv=CONC="${{ matrix.conc }}" --setenv=CITIES="${{ matrix.cities }}" \
            bash /home/user/workspace/ceezr/deploy/capacity-run/b24-runner/seat-load01m-mixed.sh

      - name: رفع الدليل (لا يُرفعُ إلا بنجاحِ تدقيقِ الأسرار)
        uses: actions/upload-artifact@v5
        with:
          name: load01m-${{ matrix.name }}
          path: /home/user/load01m-out/
          if-no-files-found: warn
          retention-days: 30

      - name: رفع تقرير الفشل المنقح (تدقيقُ الأسرارِ وحدَه)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: load01m-${{ matrix.name }}-failure-report
          path: /home/user/load01m-out/secret-audit.txt
          if-no-files-found: ignore
