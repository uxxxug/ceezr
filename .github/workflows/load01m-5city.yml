name: LOAD-01M — المدن الخمس المتزامنة (هدفٌ مكمِّلٌ لـLOAD-01، مقعد 4 vCPU)

# تجربةُ قياسٍ على فرعِ القياسِ وحدَه ولا تُدمَج. PROTOCOL-load01m.md مثبَّتٌ في الالتزامِ نفسِه قبلَ أوّلِ موجة.
#   الشيفرةُ = EXP_SHA (main + المولّدُ متعدّدُ المدن) — لا تغييرَ في المنتج (يُتحقَّقُ آليًّا في المقعد).
#   كلُّ موجةٍ على مشغِّلٍ مستقلٍّ بمرجعِ خمولٍ خاصٍّ به. gatewayRequest 5 وIMMEDIATE_REDISPATCH_LIMIT 50 دونَ تغيير.
#   لا قاعدةَ إنتاج، لا Render، لا تيليجرامَ حقيقي.
on:
  push:
    branches: [exp/load01m-5city]
    paths:
      - deploy/capacity-run/b24-runner/**
      - .github/workflows/load01m-5city.yml

permissions:
  contents: read

env:
  MAIN_SHA: af6aa4a4fa8e953d51ed46bcda84b150be829fc7
  EXP_SHA: af6aa4a4fa8e953d51ed46bcda84b150be829fc7
  # SOAK-01: الشيفرةُ = main نفسُه (بعدَ دمجِ #631 و#632) — لا فرقَ منتجٍ مسموح.
  EXPECTED_PRODUCT_DIFF: ""

jobs:
  seat:
    name: "${{ matrix.name }} (scenarios=${{ matrix.conc }}, cities=${{ matrix.cities }})"
    runs-on: ubuntu-26.04
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        include:
          # SOAK-01: تحمّلٌ مستدامٌ 60 دقيقةً لكلِّ موجةٍ، المدنُ الخمسُ معًا، كلُّ مستوى مرّتان على مشغِّلَين مستقلَّين.
          - { name: soak-m5-150-a, conc: 150, cities: "JED,MKK,RUH,TIF,MED" }
          - { name: soak-m5-150-b, conc: 150, cities: "JED,MKK,RUH,TIF,MED" }
          - { name: soak-m5-250-a, conc: 250, cities: "JED,MKK,RUH,TIF,MED" }
          - { name: soak-m5-250-b, conc: 250, cities: "JED,MKK,RUH,TIF,MED" }
          - { name: soak-m5-350-a, conc: 350, cities: "JED,MKK,RUH,TIF,MED" }
          - { name: soak-m5-350-b, conc: 350, cities: "JED,MKK,RUH,TIF,MED" }
          - { name: soak-m5-500-a, conc: 500, cities: "JED,MKK,RUH,TIF,MED" }
          - { name: soak-m5-500-b, conc: 500, cities: "JED,MKK,RUH,TIF,MED" }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: تجهيز المقعد
        run: sudo bash deploy/capacity-run/b24-runner/provision-root.sh

      - name: نسخة المستودع للمستخدم user
        run: |
          sudo cp -a "$GITHUB_WORKSPACE" /home/user/workspace/ceezr
          sudo chown -R user:user /home/user/workspace/ceezr
          for X in "$MAIN_SHA" "$EXP_SHA"; do sudo -u user git -C /home/user/workspace/ceezr cat-file -e "$X^{commit}"; done

      - name: المقعد والموجة (داخل ceezrseat.slice)
        run: |
          sudo systemd-run --quiet --wait --pipe --collect --slice=ceezrseat.slice \
            --uid=user --gid=user -p LimitNOFILE=65536 -p WorkingDirectory=/home/user \
            --setenv=MAIN_SHA="$MAIN_SHA" --setenv=EXP_SHA="$EXP_SHA" --setenv=EXPECTED_PRODUCT_DIFF="$EXPECTED_PRODUCT_DIFF" --setenv=WAVE_SEC=3600 \
            bash /home/user/workspace/ceezr/deploy/capacity-run/b24-runner/seat-load01m.sh "${{ matrix.name }}" "${{ matrix.conc }}" "${{ matrix.cities }}"

      - name: رفع الدليل (لا يُرفعُ إلا بنجاحِ تدقيقِ الأسرار)
        uses: actions/upload-artifact@v5
        with:
          name: load01m-${{ matrix.name }}
          path: /home/user/load01m-out/
          if-no-files-found: warn
          retention-days: 30

      - name: رفع تقرير الفشل المنقح (تدقيقُ الأسرارِ وحدَه)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: load01m-${{ matrix.name }}-failure-report
          path: /home/user/load01m-out/secret-audit.txt
          if-no-files-found: ignore
