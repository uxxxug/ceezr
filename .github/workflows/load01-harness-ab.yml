name: LOAD01-HARNESS-AB · خفض أثر المراقب في أداة الحمل — مقارنة مقترنة (مقعد 4 vCPU)

# PROTOCOL-load01-harness-ab.md مثبَّتٌ في الالتزامِ نفسِه قبلَ أوّلِ موجة. A = main، B = أداةُ الحملِ المخفَّفة (لا شيفرةَ منتَج).
# gatewayRequest 5 وIMMEDIATE_REDISPATCH_LIMIT 50 دونَ تغيير. لا قاعدةَ إنتاج، لا Render، لا تيليجرامَ حقيقي.

on:
  push:
    branches: [exp/load01-harness-overhead]
    paths:
      - deploy/capacity-run/b24-runner/seat-load01-harness-ab.sh
      - deploy/capacity-run/b24-runner/harness-ab-analyze.py
      - deploy/capacity-run/b24-runner/harness-ab-analyze-selftest.py
      - docs/evidence/capacity/LOAD01-HARNESS-AB-20261027/PROTOCOL-load01-harness-ab.md
      - .github/workflows/load01-harness-ab.yml

permissions:
  contents: read

env:
  # PROTOCOL §2: A = main (174bc054)؛ B = التزامُ الأداة (فرقُه عن A ثلاثةُ ملفّاتٍ تحتَ deploy/capacity-run/load).
  A_SHA: 174bc0548a180c6a9ca39fc36002cc7268cad2b5
  B_SHA: 5012127336df28a502b63411200b485fa9dac8c3
  MIXED_RATE: "20"
  MIXED_SEED: "1"

jobs:
  seat:
    name: "harness-ab (S1/S2 + 8 paired waves m5-1500 + mixed)"
    runs-on: ubuntu-26.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: تجهيز المقعد
        run: sudo bash deploy/capacity-run/b24-runner/provision-root.sh

      - name: نسخة المستودع للمستخدم user
        run: |
          sudo cp -a "$GITHUB_WORKSPACE" /home/user/workspace/ceezr
          sudo chown -R user:user /home/user/workspace/ceezr
          for X in "$A_SHA" "$B_SHA"; do sudo -u user git -C /home/user/workspace/ceezr cat-file -e "$X^{commit}"; done

      - name: المقعد والموجات (داخل ceezrseat.slice)
        run: |
          sudo systemd-run --quiet --wait --pipe --collect --slice=ceezrseat.slice \
            --uid=user --gid=user -p LimitNOFILE=65536 -p WorkingDirectory=/home/user \
            --setenv=A_SHA="$A_SHA" --setenv=B_SHA="$B_SHA" --setenv=SMOKE_CONC="100" --setenv=IMAGE_OS="${ImageOS:-}" --setenv=IMAGE_VERSION="${ImageVersion:-}" --setenv=MIXED_RATE="$MIXED_RATE" --setenv=MIXED_SEED="$MIXED_SEED" --setenv=CONC="1500" --setenv=CITIES="JED,MKK,RUH,TIF,MED" \
            bash /home/user/workspace/ceezr/deploy/capacity-run/b24-runner/seat-load01-harness-ab.sh

      # قرارُ الرفعِ منَ تدقيقٍ نهائيٍّ جديدٍ بعدَ انتهاءِ المقعدِ (دائمًا) يُبطلُ أيَّ تصريحٍ
      # سابقٍ — علامةُ بوابةٍ أو ختامٍ سابقٍ لا تُجيزُ رفعَ محتوىً لاحقٍ لم يجتزْ تدقيقًا.
      - name: التدقيق النهائي وقرار الرفع
        id: gatecheck
        if: always()
        env:
          PROBE_OUT: /home/user/load01harness-out
          PROBE_SECRETS: /srv/ceezr-cap-20261016/secrets.env
          PROBE_AUDIT_PY: /home/user/workspace/ceezr/deploy/capacity-run/b24-runner/seat-bin/b24-secret-audit.py
          PROBE_FINAL: /home/user/workspace/ceezr/deploy/capacity-run/b24-runner/probe-final-audit.sh
        run: |
          set +e
          # إبطالُ أيِّ تصريحٍ سابقٍ في خطوةِ الاستدعاءِ نفسِها قبلَ أيِّ شيءٍ آخر —
          # فلا تنجوَ علامةٌ قديمةٌ ولو تعذّرَ تشغيلُ البرنامجِ النهائيِّ نفسُه.
          sudo rm -f "$PROBE_OUT/AUDIT_PASSED"
          sudo bash "$PROBE_FINAL" "$PROBE_OUT" "$PROBE_SECRETS" "$PROBE_AUDIT_PY"
          RC=$?
          set -e
          # الافتراضي تقريرٌ منقَّحٌ؛ الرفعُ الكاملُ لا يجوزُ إلا برمزِ 0 **و** علامةٍ جديدةٍ
          if [ "$RC" -eq 0 ] && [ -f "$PROBE_OUT/AUDIT_PASSED" ]; then
            MODE=evidence
          else
            MODE=report
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          # تقريرُ حالةٍ منقَّحٌ جديدٌ لهذهِ المحاولةِ نفسِها — مستقلٌّ عنْ قدرةِ البرنامجِ
          # النهائيِّ على البدءِ (يتضمّنُ رمزَ الخروجِ وهلْ أُنتجَ تقريرُهُ)؛ لا يُنسخُ فيهِ
          # مخرجاتٌ عشوائيةٌ قد تحملُ أسرارًا — أرقامٌ وقرارٌ فقط.
          printf 'final_audit_exit=%s\nfinal_report_produced=%s\ndecision=%s\ndate_utc=%s\n' \
            "$RC" "$([ -s "$PROBE_OUT/final-secret-audit.txt" ] && echo yes || echo no)" "$MODE" "$(date -Is)" \
            | sudo tee "$PROBE_OUT/final-audit-status.txt" >/dev/null
          # إخفاقُ التدقيقِ النهائيِّ إخفاقٌ في حالةِ التشغيلِ (خطواتُ الرفعِ تعملُ دائمًا)
          exit $RC

      # الدليلُ يُرفعُ في مساري النجاحِ والتوقفِ المُوثَّقِ كليهما إذا اجتازَ المحتوى النهائيُّ
      # تدقيقَ الأسرارِ (AUDIT_PASSED) — فتوقُّفُ البوابةِ نتيجةٌ تشخيصيةٌ تُحفظُ لا تُستبدلُ؛
      # وعندَ إخفاقِ التدقيقِ لا يُرفعُ إلا التقريرُ المنقَّحُ (الأثرُ الخامُ سقطَ في المقعدِ).
      - name: رفع الدليل (نجاحٌ أو توقفٌ موثَّقٌ بعد تدقيقٍ نظيف)
        if: always() && steps.gatecheck.outputs.mode == 'evidence'
        uses: actions/upload-artifact@v5
        with:
          name: load01harness
          path: /home/user/load01harness-out/
          if-no-files-found: warn
          retention-days: 30

      - name: رفع تقرير الفشل المنقح (تقريرُ التدقيقِ النهائيِّ أولًا)
        if: always() && steps.gatecheck.outputs.mode == 'report'
        uses: actions/upload-artifact@v5
        with:
          name: load01harness-failure-report
          path: |
            /home/user/load01harness-out/final-audit-status.txt
            /home/user/load01harness-out/final-secret-audit.txt
            /home/user/load01harness-out/secret-audit.txt
          if-no-files-found: ignore
