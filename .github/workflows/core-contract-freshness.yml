# مُقابِلُ طزاجةِ العقودِ المنقولةِ — بالطلبِ اليدويِّ وحدَه · البند `DEP-CORE-005`
#
# ## لِمَ جريَةٌ منفصلةٌ لا خطوةٌ في `verify`
#
# لأنَّ هذا المُقابِلَ يلزمُه **بايتاتُ CORE**، و`uxxxug/wasla-core` مستودَعٌ
# خاصٌّ، ورِمزُ جرياتِ هذا المستودَعِ (`GITHUB_TOKEN`) لا يقرأُ مستودَعاً خاصّاً
# آخرَ. فلو وُضِعَ خطوةً في `verify` لأخفقَ في كلِّ جريَةٍ لسببٍ **ليسَ في شيفرتِنا**،
# وحاجزٌ يُخفِقُ لغيرِ ذنبِنا يُعلِّمُ الناسَ تجاهُلَه، وذاكَ إتلافُ حاجزٍ لا
# إنشاؤُه.
#
# ولا `schedule` فيه: جريَةٌ دوريّةٌ تُخفِقُ كلَّ يومٍ بلا وصولٍ تُنشِئُ ضجيجاً
# يُعطِّلُ القراءةَ. فيبقى **بالطلبِ** حتّى تُمنَحَ `O-6`.
#
# ## ولِمَ لا يُودَعُ سرٌّ ههنا
#
# المُقابِلُ لا يقرأُ رِمزاً ولا يُنادي HTTP ألبتّةَ: يُعطى مسارَ **نسخةٍ محلّيّةٍ**
# من CORE فيقرأُها بـ`git show`. فمن مَلَكَ الوصولَ أعطاه نسخةً — بخطوةِ
# `actions/checkout` لمستودَعٍ ثانٍ برِمزٍ يملكُه، أو على حاسبِه بأمرٍ واحدٍ — ولا
# يُودَعُ في المستودَعِ سرٌّ ولا يُحمَلُ في هذا الملفِّ.
#
# وحينَ تُمنَحُ `O-6` يُزادُ ههنا `actions/checkout` ثانٍ لـCORE، ثمَّ يُنقَلُ
# الأمرُ خطوةً مُسمَّاةً في `verify`، وعندَها **وحدَها** تُقفَلُ `DEP-CORE-005`.

name: طزاجةُ العقودِ المنقولةِ (بالطلبِ)

on:
  workflow_dispatch:
    inputs:
      core_dir:
        description: >-
          مسارُ نسخةٍ محلّيّةٍ من مستودَعِ CORE داخلَ فضاءِ العملِ. يُترَكُ فارغاً
          ليُقرأَ المخرَجُ 3 «غيرُ قابلٍ للتحقُّقِ» — وذاكَ دليلٌ على أنَّ الفحصَ
          لا يُدَّعي طزاجةً بلا مصدرٍ، لا عطبٌ فيه.
        required: false
        default: ""

permissions:
  contents: read

jobs:
  freshness:
    name: مقابلةُ المنقولِ بمصدرِه عندَ CORE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: سندُ العقودِ المنقولةِ مُفكَّكٌ قبلَ أيِّ مقابلةٍ
        run: bun run scripts/check-vendored-contract-pins.ts

      # المخرَجُ 3 يُقرأُ «غيرُ قابلٍ للتحقُّقِ» ويُنهي الجريَةَ إخفاقاً مُسمَّىً:
      # لا يُقرأُ نجاحاً ولا تخطّياً، فلا يُظَنُّ أنَّ الطزاجةَ قِيسَت.
      - name: مقابلةُ الطزاجةِ — أو تصريحٌ بأنَّها غيرُ قابلةٍ للتحقُّقِ
        run: |
          set -o pipefail
          bun run scripts/check-core-contract-freshness.ts \
            ${{ inputs.core_dir != '' && format('--from-dir={0}', inputs.core_dir) || '' }} \
            2>&1 | tee /tmp/freshness.log
          status=${PIPESTATUS[0]}
          if [ "$status" = "3" ]; then
            echo "::error::الطزاجةُ غيرُ قابلةٍ للتحقُّقِ — لا نسخةَ من CORE (O-6). لا دعوى طزاجةٍ تُقرأُ من هذه الجريَةِ."
          fi
          exit "$status"

      - name: حفظُ المُخرَجِ دليلاً
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-contract-freshness
          path: /tmp/freshness.log
          if-no-files-found: warn
