name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile || bun install

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: منع الكود الوهمي في الملفات المنفّذة
        run: |
          if grep -rn "In production this would" --include="*.ts" .; then
            echo "::error::تعليق كود وهمي ممنوع (القاعدة 0.1)"
            exit 1
          fi

      - name: منع الأرقام التجارية المرمَّزة داخل الكود
        run: |
          if grep -rnE "(^|[^0-9a-zA-Z_.])(250|400)([^0-9a-zA-Z_]|$)" \
               --include="*.ts" apps packages/domain packages/application; then
            echo "::error::سعر مرمَّز داخل الكود ممنوع — مكانه platform_settings (القاعدة 0.3)"
            exit 1
          fi

      - name: منع استيراد infrastructure داخل domain
        run: |
          if grep -rnE "^\s*(import|export)[^;]*from\s+['\"][^'\"]*infrastructure" \
               --include="*.ts" packages/domain; then
            echo "::error::domain لا يستورد من infrastructure إطلاقاً (ADR 0002)"
            exit 1
          fi

      - name: منع أي جدول بلا city_id في المخططات
        run: |
          bun run scripts/check-migrations.ts
