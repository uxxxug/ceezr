name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile || bun install

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: منع الكود الوهمي في الملفات المنفّذة
        run: |
          if grep -rn "In production this would" --include="*.ts" .; then
            echo "::error::تعليق كود وهمي ممنوع (القاعدة 0.1)"
            exit 1
          fi
