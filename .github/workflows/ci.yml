name: CI

# `feat/**` مُضافة عن قصد: سياسةُ العمل تُلزم بالتحقّق من نجاح CI **بعد كل دفعة**
# لا آخرَ العمل، وكان الزنادُ على `main` وحدها فكانت الدفعاتُ على فرع العمل تمرّ
# بلا فحصٍ بعيدٍ إطلاقاً — فيتراكم عملٌ يُظنّ محقَّقاً ثم يُكتشف إخفاقه كلّه دفعةً
# واحدة عند فتح طلب الدمج.
on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: بناء تطبيق تِلِغرام المصغَّر
        run: bun run build:miniapp

      - name: Test
        run: set -o pipefail; bun run test 2>&1 | tee /tmp/ci-output.log

      - name: تفاصيل الإخفاق في تعليقٍ مقروء بلا سجلّات
        if: failure()
        run: |
          # الإخفاقُ الذي لا يُقرأ سببُه يُعالَج بالتخمين. وسجلّاتُ الوظيفة تُحمَّل
          # من تخزينٍ خارجيٍّ موقَّعٍ لا يبلغه كلُّ مراجع، فذيلُ المخرجات يُرفَع هنا
          # كملحوظةِ فحصٍ تظهر مع النتيجة نفسها.
          if [ ! -f /tmp/ci-output.log ]; then
            echo "::error::أخفقت الخطوة قبل أن تُنتج مخرجات — راجع الخطوة السابقة"
            exit 0
          fi
          # أسماءُ المخفقة أوّلاً مجموعةً في ملحوظةٍ واحدة: هي الفهرس. ثم تفصيلُ
          # الإخفاق في ملحوظاتٍ متتابعةٍ من ٢٥٠ سطراً، لأنّ الملحوظةَ الواحدة
          # محدودةُ الطول، وقطعُ التفصيل عند ستّين سطراً كان يُخفي أوّلَ الأسباب
          # ويُبقي آخِرَها — وأوّلُ الإخفاق هو ما يُشخَّص، وما بعده تَبَعٌ له.
          # الملحوظةُ الواحدة تُقتطع عند نحوِ ثلاثةِ آلافِ حرف، فرفعُ المخرجاتِ
          # كاملةً يضيع أكثرَه. ولذلك يُرفَع المفيدُ وحده: أسماءُ المخفقة فهرساً،
          # ثمّ ثلاثون سطراً قبل كلِّ إخفاقٍ — وفيها يطبع bun نصَّ الخطأ والمقارنةَ
          # والأثرَ — في ملحوظاتٍ صغيرةٍ لا تُقتطع.
          grep -n '^(fail)' /tmp/ci-output.log > /tmp/ci-fails.txt || true
          if [ -s /tmp/ci-fails.txt ]; then
            idx=$(cut -c1-160 /tmp/ci-fails.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=فهرس الاختبارات المخفقة::${idx}"
          fi
          : > /tmp/ci-context.txt
          for lineno in $(cut -d: -f1 /tmp/ci-fails.txt | head -40); do
            start=$((lineno > 30 ? lineno - 30 : 1))
            sed -n "${start},${lineno}p" /tmp/ci-output.log >> /tmp/ci-context.txt
            echo "──────── نهاية سياق إخفاق ────────" >> /tmp/ci-context.txt
          done
          if [ ! -s /tmp/ci-context.txt ]; then cp /tmp/ci-output.log /tmp/ci-context.txt; fi
          rm -f /tmp/ci-part-*
          split -l 22 -d -a 2 <(cut -c1-300 /tmp/ci-context.txt | sed 's/%/%25/g') /tmp/ci-part-
          count=0
          for part in /tmp/ci-part-*; do
            count=$((count + 1))
            if [ "$count" -gt 24 ]; then
              echo "::error::سياقُ الإخفاق أطولُ من أربعٍ وعشرين ملحوظة — الباقي محجوب"
              break
            fi
            body=$(awk '{printf "%s%%0A", $0}' "$part")
            echo "::error title=سياق ${part##*-}::${body}"
          done

      - name: منع الكود الوهمي في الملفات المنفّذة
        run: |
          if grep -rn "In production this would" --include="*.ts" .; then
            echo "::error::تعليق كود وهمي ممنوع (القاعدة 0.1)"
            exit 1
          fi

      - name: منع الأرقام التجارية المرمَّزة داخل الكود
        run: bun run scripts/check-business-constants.ts

      - name: منع استيراد infrastructure داخل domain
        run: |
          if grep -rnE "^\s*(import|export)[^;]*from\s+['\"][^'\"]*infrastructure" \
               --include="*.ts" packages/domain; then
            echo "::error::domain لا يستورد من infrastructure إطلاقاً (ADR 0002)"
            exit 1
          fi

      - name: منع استيراد application داخل domain
        run: |
          if grep -rnE "^\s*(import|export)[^;]*from\s+['\"][^'\"]*application" \
               --include="*.ts" packages/domain; then
            echo "::error::domain لا يعتمد على application (ADR 0002)"
            exit 1
          fi

      - name: منع استيراد مزدوجات الاختبار في كود الإنتاج
        run: |
          if grep -rnE "^\s*(import|export)[^;]*from\s+['\"][^'\"]*tests/" \
               --include="*.ts" packages apps; then
            echo "::error::ممنوع استيراد أي شيء من tests/ داخل packages أو apps (القاعدة 0.1)"
            exit 1
          fi

      - name: منع أي جدول بلا city_id في المخططات
        run: |
          bun run scripts/check-migrations.ts

      - name: تطابق قواميس اللغات
        run: bun run scripts/check-i18n.ts

      - name: عزل طبقة الذكاء الاصطناعي — اتجاه اعتماد واحد
        run: bun run scripts/check-agent-core-isolation.ts

      - name: حدّ النطاق — مطابقة المسار خارج الإصدار (ADR 0025)
        run: bun run scripts/check-map-matching-scope.ts

      - name: تفرّد أرقام القرارات المعمارية (ADR 0038)
        run: bun run scripts/check-adr-numbering.ts

      - name: بناء الصورتين قابل لإعادة الإنتاج (قفل مجمَّد + استيرادات محلولة)
        run: bash scripts/verify-container-build.sh

      - name: كلّ متغيّر بيئة موثَّق مقروءٌ فعلاً في الكود
        run: bun run scripts/check-env-drift.ts

      - name: لا اختبارَ ينجح بترتيبِ الملفّات — تفعيلُ المدينة مكتملٌ في عبارته
        run: bun run scripts/check-test-city-activation.ts

      - name: لا حاويةَ اختبارٍ تُبنى لكلِّ اختبارٍ وتُغلق مرّةً واحدة
        run: bun run scripts/check-test-container-lifecycle.ts

      - name: عقدُ المخطّط يطابق ما يناديه الكود (فحصُ الجهوزية يقرؤه)
        run: bun run scripts/check-schema-contract.ts

      - name: كلُّ استدعاءِ تيليجرامٍ عبر طبقةِ التغليف وحدَها (F1-02 · ADR 0031)
        run: bun run scripts/check-telegram-wrapper-isolation.ts

      - name: لا سرَّ ولا بيانَ اعتمادٍ يُمرَّر إلى سجلٍّ (F1-03)
        run: bun run scripts/check-secret-logging.ts

      - name: رمزُ التجديدِ في التخزينِ الآمنِ وحدَه ورمزُ الوصولِ في الذاكرة (F1-04 · القسم 4.4)
        run: bun run scripts/check-session-storage-policy.ts

      - name: الدورُ من الخادمِ وحدَه — لا تخزينَ ولا افتراضَ ولا دورَ من الطلب (F1-05)
        run: bun run scripts/check-viewer-role-authority.ts

      - name: شاشاتُ الحالاتِ بلا استقصاءٍ دوريٍّ ومواضعُها مفردة (F1-07 · ADR 0035 §4)
        run: bun run scripts/check-system-screens-policy.ts

      - name: القياسُ لا يخرج من الجهازِ ومعرّفُ الطلبِ من الخادمِ وحدَه (F1-08 · ADR 0043)
        run: bun run scripts/check-telemetry-policy.ts

      # يقرأ `apps/miniapp/dist` فلا يصلُح قبلَ خطوةِ البناءِ أعلاه. ومفحوصُه ثلاثةُ
      # صفوفٍ من ثمانيةٍ: الحملُ الأوّلُ · الحزمُ المؤجَّلةُ · طلباتُ أوّلِ رسمٍ. والأزمنةُ
      # (FCP · LCP · زمنُ التفاعلِ) لا تُقاس ههنا ولا يُدَّعى قياسُها — ولذلك بندُ
      # `F1-09` لم يُختَم `[x]`. التفصيلُ في docs/evidence/architecture/F1-09-20260829.md
      - name: ميزانيةُ الأداءِ من مُخرَجِ البناءِ لا من وعدٍ (F1-09 · القسم 9.9 · ADR 0044)
        run: bun run scripts/check-performance-budget.ts

      # يقرأ `apps/miniapp/dist/index.html` أيضاً فلا يصلُح قبلَ البناءِ. ويقارن سياسةَ
      # المُخرَجِ بما تبنيه وحدةُ السياسةِ حرفاً حرفاً، فبصمةُ أنماطٍ متقادمةٌ أو سياسةٌ
      # مكتوبةٌ بيدٍ تُسقِط البناءَ. والوسمُ **أضعفُ من رأسِ الاستجابةِ** ولا يُدَّعى
      # غيرُ ذلك: `frame-ancestors` مُهمَلةٌ فيه ولا مضيفَ للتطبيقِ بعدُ (ADR 0045 §٥).
      - name: النطاقُ واحدٌ ولا أصلَ تنفيذيّاً من نطاقٍ ثالثٍ (F1-10 · TG-005 · ADR 0045)
        run: bun run scripts/check-single-origin-assets.ts

      # يقرأ مواضعَ التجاوزِ من الشيفرةِ ويطابقها بالسجلِّ، ثمّ يتحقّق من ملفِّ سيرِ
      # العملِ أنّ كلَّ تجاوزٍ على مسارٍ حرجٍ له خطوةٌ **تضبط شرطَ تفعيلِه وتُشغِّل مسارَ
      # ملفِّه**. والتجاوزُ غيرُ المشروطِ (`describe.skip(…)` نداءً · `only` · `todo`)
      # ممنوعٌ منعاً مطلقاً ولا يُفتَح له بابُ تسجيلٍ.
      - name: لا تجاوزَ اختبارٍ بلا تصنيفٍ ومالكٍ وشرطِ تفعيلٍ (OPS-009 · القسم 11-د · ADR 0046)
        run: bun run scripts/check-skip-classification.ts

      # يقيس التغطيةَ مرّةً أخرى بعدَ خطوةِ Test — عن قصدٍ لا سهواً: خطوةُ Test
      # تُغذّي حاجزَ قراءةِ الإخفاقِ من `/tmp/ci-output.log`، فلا يُمَسُّ أمرُها.
      # والقياسُ ههنا **لا يقيس اختباراتَ التكامل** لأنّها تتجاوز نفسَها بلا قاعدةٍ
      # حقيقيّةٍ في هذه الوظيفة، والحدُّ مُعلَنٌ في `scripts/lib/coverage-registry.ts`.
      - name: بوابةُ تغطيةٍ دنيا على المسارات الحرجة (OPS-005 · القسم 11-د · ADR 0048)
        run: bun run check:coverage

      - name: لا نصّ ظاهر للمستخدم مكتوب داخل منطق الحوار
        run: |
          if grep -rnE '(reply\(sender, ")[^t]' packages/application/bots/ ; then
            echo "❌ نصّ مباشر داخل منطق الحوار: كل نصّ يمرّ عبر i18n"; exit 1;
          fi
          echo "✅ كل نصوص الحوار من القواميس"

  integration:
    name: تكامل على PostgreSQL حقيقي
    runs-on: ubuntu-latest
    # يُلزم الرقيبَ بالإخفاق لو ضاع رابطُ القاعدة من هذه الوظيفة: اختباراتُ
    # التكامل تُتخطّى بصمتٍ حين يغيب، فيُعلَن الفحصُ أخضرَ بلا تجريبِ SQL أصلاً.
    env:
      CI_REQUIRE_DB: "1"
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waslah
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: أدوار Supabase التي تفترضها الهجرات
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d waslah -v ON_ERROR_STOP=1 <<'SQL'
          do $$ begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then
              create role anon nologin noinherit;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then
              create role authenticated nologin noinherit;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then
              create role service_role nologin noinherit bypassrls;
            end if;
          end $$;
          SQL

      - name: تطبيق الهجرات بالترتيب
        env:
          PGPASSWORD: postgres
        run: |
          for file in $(ls supabase/migrations/*.sql | sort); do
            echo "▶ $file"
            psql -h localhost -U postgres -d waslah -v ON_ERROR_STOP=1 -f "$file"
          done

      # `pg_dump` يرفض خادماً أحدثَ منه إصداراً رئيسياً، واختبارُ تحقّقِ الاستعادة
      # يستدعيه فعلاً على خدمةِ PostgreSQL 17 — أمّا صورةُ العامل فتحمل أدواتَ
      # إصدارٍ أقدم. النتيجةُ إخفاقٌ لا يظهر محلّياً حيث النسختان متوافقتان، فيبدو
      # كعيبٍ في منطقِ النسخ الاحتياطيّ وهو عيبُ بيئةٍ صِرْف. فتُثبَّت أدواتُ العميل
      # من مستودعِ PostgreSQL الرسميّ، ثم يُقارَن الإصدارانِ ويسقط البناءُ بالسببِ
      # مكتوباً إن اختلفا — لا سقوطاً صامتاً ولا تخطّياً للاختبار.
      - name: أدواتُ عميلِ PostgreSQL مطابقةٌ لإصدارِ الخادم
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          server_major="$(psql -h localhost -U postgres -d waslah -tAc 'show server_version' | cut -d. -f1 | tr -d '[:space:]')"
          echo "الخادم: إصدار رئيسيّ $server_major"
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          codename="$(lsb_release -cs)"
          repo="https://apt.postgresql.org/pub/repos/apt ${codename}-pgdg main"
          signed="signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc"
          printf 'deb [%s] %s\n' "$signed" "$repo" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-${server_major}"
          echo "/usr/lib/postgresql/${server_major}/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/${server_major}/bin:$PATH"
          for tool in pg_dump pg_dumpall pg_restore psql; do
            version="$("$tool" --version)"
            echo "$tool: $version"
            tool_major="$(echo "$version" | grep -oE '[0-9]+' | head -1)"
            if [ "$tool_major" != "$server_major" ]; then
              echo "::error::$tool إصداره $tool_major والخادم $server_major — pg_dump يرفض خادماً أحدثَ منه، فتحقّقُ الاستعادة يُخفق لسببِ بيئةٍ لا لسببِ منطق."
              exit 1
            fi
          done

      - name: تمرين مسار العودة — الهجرات واحدةً واحدةً على قاعدة حقيقية
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: bun run scripts/rollback-schema-drill.ts

      - name: اختبارات التكامل على قاعدة حقيقية
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: set -o pipefail; bun run test:integration 2>&1 | tee /tmp/ci-output.log

      - name: تفاصيل الإخفاق في تعليقٍ مقروء بلا سجلّات
        if: failure()
        run: |
          # الإخفاقُ الذي لا يُقرأ سببُه يُعالَج بالتخمين. وسجلّاتُ الوظيفة تُحمَّل
          # من تخزينٍ خارجيٍّ موقَّعٍ لا يبلغه كلُّ مراجع، فذيلُ المخرجات يُرفَع هنا
          # كملحوظةِ فحصٍ تظهر مع النتيجة نفسها.
          if [ ! -f /tmp/ci-output.log ]; then
            echo "::error::أخفقت الخطوة قبل أن تُنتج مخرجات — راجع الخطوة السابقة"
            exit 0
          fi
          # أسماءُ المخفقة أوّلاً مجموعةً في ملحوظةٍ واحدة: هي الفهرس. ثم تفصيلُ
          # الإخفاق في ملحوظاتٍ متتابعةٍ من ٢٥٠ سطراً، لأنّ الملحوظةَ الواحدة
          # محدودةُ الطول، وقطعُ التفصيل عند ستّين سطراً كان يُخفي أوّلَ الأسباب
          # ويُبقي آخِرَها — وأوّلُ الإخفاق هو ما يُشخَّص، وما بعده تَبَعٌ له.
          # الملحوظةُ الواحدة تُقتطع عند نحوِ ثلاثةِ آلافِ حرف، فرفعُ المخرجاتِ
          # كاملةً يضيع أكثرَه. ولذلك يُرفَع المفيدُ وحده: أسماءُ المخفقة فهرساً،
          # ثمّ ثلاثون سطراً قبل كلِّ إخفاقٍ — وفيها يطبع bun نصَّ الخطأ والمقارنةَ
          # والأثرَ — في ملحوظاتٍ صغيرةٍ لا تُقتطع.
          grep -n '^(fail)' /tmp/ci-output.log > /tmp/ci-fails.txt || true
          if [ -s /tmp/ci-fails.txt ]; then
            idx=$(cut -c1-160 /tmp/ci-fails.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=فهرس الاختبارات المخفقة::${idx}"
          fi
          : > /tmp/ci-context.txt
          for lineno in $(cut -d: -f1 /tmp/ci-fails.txt | head -40); do
            start=$((lineno > 30 ? lineno - 30 : 1))
            sed -n "${start},${lineno}p" /tmp/ci-output.log >> /tmp/ci-context.txt
            echo "──────── نهاية سياق إخفاق ────────" >> /tmp/ci-context.txt
          done
          if [ ! -s /tmp/ci-context.txt ]; then cp /tmp/ci-output.log /tmp/ci-context.txt; fi
          rm -f /tmp/ci-part-*
          split -l 22 -d -a 2 <(cut -c1-300 /tmp/ci-context.txt | sed 's/%/%25/g') /tmp/ci-part-
          count=0
          for part in /tmp/ci-part-*; do
            count=$((count + 1))
            if [ "$count" -gt 24 ]; then
              echo "::error::سياقُ الإخفاق أطولُ من أربعٍ وعشرين ملحوظة — الباقي محجوب"
              break
            fi
            body=$(awk '{printf "%s%%0A", $0}' "$part")
            echo "::error title=سياق ${part##*-}::${body}"
          done

      # الخطوةُ السابقةُ كانت تُعيد تشغيلَ الحزمةِ كاملةً ثمّ تبحث بـ`grep` عن جملةِ
      # تحذيرٍ يكتبها كلُّ ملفٍّ بيدِه — وأربعةٌ وعشرون ملفّاً من خمسةٍ وخمسين لا تطبعها،
      # فكانت تلك الملفّاتُ تُتجاوَز صامتةً والحاجزُ أخضرُ (OPS-009). والآن يُقرَأ
      # **ملخَّصُ المُشغِّلِ نفسِه** من سجلِّ الخطوةِ السابقةِ بلا إعادةِ تشغيلٍ.
      - name: منع تخطّي اختبارات التكامل صامتاً
        run: bun run scripts/check-no-skipped-tests.ts /tmp/ci-output.log

      # e2e منفصلة عن التكامل لأنها أطول وتراكمية: ثلاثون رحلة على حالة واحدة
      # لا تُنظَّف بينها. فصلها يجعل فشلها مقروءاً بذاته لا مبتلعاً في حزمة كبيرة.
      - name: اختبارات e2e — رحلات متتابعة بلا تدخّل
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: set -o pipefail; bun run test:e2e 2>&1 | tee /tmp/ci-output.log

      - name: تفاصيل الإخفاق في تعليقٍ مقروء بلا سجلّات
        if: failure()
        run: |
          # الإخفاقُ الذي لا يُقرأ سببُه يُعالَج بالتخمين. وسجلّاتُ الوظيفة تُحمَّل
          # من تخزينٍ خارجيٍّ موقَّعٍ لا يبلغه كلُّ مراجع، فذيلُ المخرجات يُرفَع هنا
          # كملحوظةِ فحصٍ تظهر مع النتيجة نفسها.
          if [ ! -f /tmp/ci-output.log ]; then
            echo "::error::أخفقت الخطوة قبل أن تُنتج مخرجات — راجع الخطوة السابقة"
            exit 0
          fi
          # أسماءُ المخفقة أوّلاً مجموعةً في ملحوظةٍ واحدة: هي الفهرس. ثم تفصيلُ
          # الإخفاق في ملحوظاتٍ متتابعةٍ من ٢٥٠ سطراً، لأنّ الملحوظةَ الواحدة
          # محدودةُ الطول، وقطعُ التفصيل عند ستّين سطراً كان يُخفي أوّلَ الأسباب
          # ويُبقي آخِرَها — وأوّلُ الإخفاق هو ما يُشخَّص، وما بعده تَبَعٌ له.
          # الملحوظةُ الواحدة تُقتطع عند نحوِ ثلاثةِ آلافِ حرف، فرفعُ المخرجاتِ
          # كاملةً يضيع أكثرَه. ولذلك يُرفَع المفيدُ وحده: أسماءُ المخفقة فهرساً،
          # ثمّ ثلاثون سطراً قبل كلِّ إخفاقٍ — وفيها يطبع bun نصَّ الخطأ والمقارنةَ
          # والأثرَ — في ملحوظاتٍ صغيرةٍ لا تُقتطع.
          grep -n '^(fail)' /tmp/ci-output.log > /tmp/ci-fails.txt || true
          if [ -s /tmp/ci-fails.txt ]; then
            idx=$(cut -c1-160 /tmp/ci-fails.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=فهرس الاختبارات المخفقة::${idx}"
          fi
          : > /tmp/ci-context.txt
          for lineno in $(cut -d: -f1 /tmp/ci-fails.txt | head -40); do
            start=$((lineno > 30 ? lineno - 30 : 1))
            sed -n "${start},${lineno}p" /tmp/ci-output.log >> /tmp/ci-context.txt
            echo "──────── نهاية سياق إخفاق ────────" >> /tmp/ci-context.txt
          done
          if [ ! -s /tmp/ci-context.txt ]; then cp /tmp/ci-output.log /tmp/ci-context.txt; fi
          rm -f /tmp/ci-part-*
          split -l 22 -d -a 2 <(cut -c1-300 /tmp/ci-context.txt | sed 's/%/%25/g') /tmp/ci-part-
          count=0
          for part in /tmp/ci-part-*; do
            count=$((count + 1))
            if [ "$count" -gt 24 ]; then
              echo "::error::سياقُ الإخفاق أطولُ من أربعٍ وعشرين ملحوظة — الباقي محجوب"
              break
            fi
            body=$(awk '{printf "%s%%0A", $0}' "$part")
            echo "::error title=سياق ${part##*-}::${body}"
          done

      # وكذلك e2e: يُقرَأ سجلُّ خطوتِها وحدَه (وقد أعاد `tee` كتابتَه بعد التكامل).
      - name: منع تخطّي اختبارات e2e صامتاً
        run: bun run scripts/check-no-skipped-tests.ts /tmp/ci-output.log

  # وظيفةٌ ثالثةٌ لا خطوةٌ في القائمتَين: هذه وحدَها تُخاطِب خدمةً خارجيّةً حقيقيّةً
  # بسرٍّ من مخزنِ أسرارِ المستودعِ (OPS-006 · ADR 0049). وفصلُها مقصودٌ لسببَين:
  # أنّ سقوطَها لسببِ شبكةٍ لا يجوز أن يُخفي نتيجةَ الحواجزِ في `verify`، وأنّ السرَّ
  # لا يُحمَّل في بيئةِ خطوةٍ لا تحتاجه.
  #
  # وحدُّها المُعلَنُ: طلبُ دمجٍ من نسخةٍ متشعّبةٍ لا يُمنَح أسرارَ المستودعِ في
  # GitHub Actions أصلاً، فتُتخطّى الوظيفةُ هناك — ولا يُتخطّى شيءٌ في الدفعِ إلى
  # `main` ولا في طلبِ دمجٍ من المستودعِ نفسِه، وهو مسارُ هذا المستودعِ الفعليّ.
  real-redis:
    name: تكامل على Redis حقيقي
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waslah
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: أدوار Supabase التي تفترضها الهجرات
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d waslah -v ON_ERROR_STOP=1 <<'SQL'
          do $$ begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then
              create role anon nologin noinherit;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then
              create role authenticated nologin noinherit;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then
              create role service_role nologin noinherit bypassrls;
            end if;
          end $$;
          SQL

      - name: تطبيق الهجرات بالترتيب
        env:
          PGPASSWORD: postgres
        run: |
          for file in $(ls supabase/migrations/*.sql | sort); do
            echo "▶ $file"
            psql -h localhost -U postgres -d waslah -v ON_ERROR_STOP=1 -f "$file"
          done

      # `REQUIRE_REAL_REDIS=1` يجعل غيابَ السرِّ **إخفاقاً** لا تخطّياً: وظيفةٌ وُجدت
      # لتُشغِّل على Redis حقيقيٍّ لا تُقرَأ خضراءَ وهي لم تُخاطِبه. والقيمتانِ تُقرآن
      # من مخزنِ الأسرارِ ولا تُطبَعان: مُشغِّلُ الاختبارِ يكتم النقطةَ والرمزَ في كلِّ
      # تفصيلِ فشلٍ (tests/support/real-redis.ts)، والحاجزُ التالي يرفض دليلاً فيه أثرٌ
      # لأحدِهما.
      - name: اختبارات الجلسات على Redis حقيقي
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
          REQUIRE_REAL_REDIS: "1"
          REAL_REDIS_PROOF_PATH: /tmp/real-redis-proof.json
        run: set -o pipefail; bun run test:real-redis 2>&1 | tee /tmp/real-redis-output.log

      - name: لا يُقرَأ زعمُ Redis حقيقيٍّ دليلاً (OPS-006 · ADR 0049)
        run: bun run scripts/check-real-redis-proof.ts /tmp/real-redis-proof.json

      # الدليلُ يُرفَع مُرفَقاً لا يُطبَع وحدَه: يُقرأ في ملفِّ الأدلّةِ بعددٍ من التشغيلِ
      # نفسِه. وهو خالٍ من النقطةِ والرمزِ بحكمِ الحاجزِ الذي سبقَه لا بحسنِ الظنّ.
      - name: رفع دليل التشغيل الحقيقي
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-redis-proof
          path: /tmp/real-redis-proof.json
          if-no-files-found: warn
