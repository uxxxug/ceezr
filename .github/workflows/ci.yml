name: CI

# `feat/**` مُضافة عن قصد: سياسةُ العمل تُلزم بالتحقّق من نجاح CI **بعد كل دفعة**
# لا آخرَ العمل، وكان الزنادُ على `main` وحدها فكانت الدفعاتُ على فرع العمل تمرّ
# بلا فحصٍ بعيدٍ إطلاقاً — فيتراكم عملٌ يُظنّ محقَّقاً ثم يُكتشف إخفاقه كلّه دفعةً
# واحدة عند فتح طلب الدمج.
on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: set -o pipefail; bun run test 2>&1 | tee /tmp/ci-output.log

      - name: تفاصيل الإخفاق في تعليقٍ مقروء بلا سجلّات
        if: failure()
        run: |
          # الإخفاقُ الذي لا يُقرأ سببُه يُعالَج بالتخمين. وسجلّاتُ الوظيفة تُحمَّل
          # من تخزينٍ خارجيٍّ موقَّعٍ لا يبلغه كلُّ مراجع، فذيلُ المخرجات يُرفَع هنا
          # كملحوظةِ فحصٍ تظهر مع النتيجة نفسها.
          if [ -f /tmp/ci-output.log ]; then
            body=$(tail -n 60 /tmp/ci-output.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=ذيل المخرجات::${body}"
          else
            echo "::error::أخفقت الخطوة قبل أن تُنتج مخرجات — راجع الخطوة السابقة"
          fi

      - name: منع الكود الوهمي في الملفات المنفّذة
        run: |
          if grep -rn "In production this would" --include="*.ts" .; then
            echo "::error::تعليق كود وهمي ممنوع (القاعدة 0.1)"
            exit 1
          fi

      - name: منع الأرقام التجارية المرمَّزة داخل الكود
        run: bun run scripts/check-business-constants.ts

      - name: منع استيراد infrastructure داخل domain
        run: |
          if grep -rnE "^\s*(import|export)[^;]*from\s+['\"][^'\"]*infrastructure" \
               --include="*.ts" packages/domain; then
            echo "::error::domain لا يستورد من infrastructure إطلاقاً (ADR 0002)"
            exit 1
          fi

      - name: منع استيراد application داخل domain
        run: |
          if grep -rnE "^\s*(import|export)[^;]*from\s+['\"][^'\"]*application" \
               --include="*.ts" packages/domain; then
            echo "::error::domain لا يعتمد على application (ADR 0002)"
            exit 1
          fi

      - name: منع استيراد مزدوجات الاختبار في كود الإنتاج
        run: |
          if grep -rnE "^\s*(import|export)[^;]*from\s+['\"][^'\"]*tests/" \
               --include="*.ts" packages apps; then
            echo "::error::ممنوع استيراد أي شيء من tests/ داخل packages أو apps (القاعدة 0.1)"
            exit 1
          fi

      - name: منع أي جدول بلا city_id في المخططات
        run: |
          bun run scripts/check-migrations.ts

      - name: تطابق قواميس اللغات
        run: bun run scripts/check-i18n.ts

      - name: عزل طبقة الذكاء الاصطناعي — اتجاه اعتماد واحد
        run: bun run scripts/check-agent-core-isolation.ts

      - name: حدّ النطاق — مطابقة المسار خارج الإصدار (ADR 0025)
        run: bun run scripts/check-map-matching-scope.ts

      - name: بناء الصورتين قابل لإعادة الإنتاج (قفل مجمَّد + استيرادات محلولة)
        run: bash scripts/verify-container-build.sh

      - name: كلّ متغيّر بيئة موثَّق مقروءٌ فعلاً في الكود
        run: bun run scripts/check-env-drift.ts

      - name: لا نصّ ظاهر للمستخدم مكتوب داخل منطق الحوار
        run: |
          if grep -rnE '(reply\(sender, ")[^t]' packages/application/bots/ ; then
            echo "❌ نصّ مباشر داخل منطق الحوار: كل نصّ يمرّ عبر i18n"; exit 1;
          fi
          echo "✅ كل نصوص الحوار من القواميس"

  integration:
    name: تكامل على PostgreSQL حقيقي
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waslah
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: أدوار Supabase التي تفترضها الهجرات
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d waslah -v ON_ERROR_STOP=1 <<'SQL'
          do $$ begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then
              create role anon nologin noinherit;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then
              create role authenticated nologin noinherit;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then
              create role service_role nologin noinherit bypassrls;
            end if;
          end $$;
          SQL

      - name: تطبيق الهجرات بالترتيب
        env:
          PGPASSWORD: postgres
        run: |
          for file in $(ls supabase/migrations/*.sql | sort); do
            echo "▶ $file"
            psql -h localhost -U postgres -d waslah -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: اختبارات التكامل على قاعدة حقيقية
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: set -o pipefail; bun run test:integration 2>&1 | tee /tmp/ci-output.log

      - name: تفاصيل الإخفاق في تعليقٍ مقروء بلا سجلّات
        if: failure()
        run: |
          # الإخفاقُ الذي لا يُقرأ سببُه يُعالَج بالتخمين. وسجلّاتُ الوظيفة تُحمَّل
          # من تخزينٍ خارجيٍّ موقَّعٍ لا يبلغه كلُّ مراجع، فذيلُ المخرجات يُرفَع هنا
          # كملحوظةِ فحصٍ تظهر مع النتيجة نفسها.
          if [ -f /tmp/ci-output.log ]; then
            body=$(tail -n 60 /tmp/ci-output.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=ذيل المخرجات::${body}"
          else
            echo "::error::أخفقت الخطوة قبل أن تُنتج مخرجات — راجع الخطوة السابقة"
          fi

      - name: منع تخطّي اختبارات التكامل صامتاً
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: |
          if bun run test:integration 2>&1 | grep -q "مُتخطّاة"; then
            echo "::error::اختبارات التكامل تُخطَّت — لا يمرّ CI بلا قاعدة حقيقية"
            exit 1
          fi

      # e2e منفصلة عن التكامل لأنها أطول وتراكمية: ثلاثون رحلة على حالة واحدة
      # لا تُنظَّف بينها. فصلها يجعل فشلها مقروءاً بذاته لا مبتلعاً في حزمة كبيرة.
      - name: اختبارات e2e — رحلات متتابعة بلا تدخّل
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: set -o pipefail; bun run test:e2e 2>&1 | tee /tmp/ci-output.log

      - name: تفاصيل الإخفاق في تعليقٍ مقروء بلا سجلّات
        if: failure()
        run: |
          # الإخفاقُ الذي لا يُقرأ سببُه يُعالَج بالتخمين. وسجلّاتُ الوظيفة تُحمَّل
          # من تخزينٍ خارجيٍّ موقَّعٍ لا يبلغه كلُّ مراجع، فذيلُ المخرجات يُرفَع هنا
          # كملحوظةِ فحصٍ تظهر مع النتيجة نفسها.
          if [ -f /tmp/ci-output.log ]; then
            body=$(tail -n 60 /tmp/ci-output.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=ذيل المخرجات::${body}"
          else
            echo "::error::أخفقت الخطوة قبل أن تُنتج مخرجات — راجع الخطوة السابقة"
          fi

      - name: منع تخطّي اختبارات e2e صامتاً
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waslah
        run: |
          if bun run test:e2e 2>&1 | grep -q "مُتخطّاة"; then
            echo "::error::اختبارات e2e تُخطَّت — لا يمرّ CI بلا قاعدة حقيقية"
            exit 1
          fi
