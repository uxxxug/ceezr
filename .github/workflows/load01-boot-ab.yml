name: LOAD-01 — قراءةُ الإقلاعِ المُدمَجةُ وفحصُ الإبطالِ بأمرٍ واحد (مقارنةٌ مقترنة، مقعد 4 vCPU)

# تجربةُ قياسٍ على فرعِ القياسِ وحدَه ولا تُدمَج. PROTOCOL-load01-boot-ab.md مثبَّتٌ في الالتزامِ نفسِه قبلَ أوّلِ موجة.
#   ذراعا شيفرة: A = رأسُ #655 وB = A + #656 + #657، أمامَ قالبِ قاعدةٍ واحدٍ (لا هجرةَ في الفرق). البوّابةُ والمولّدانِ من wt-ref مُبدَّلًا إلى شيفرةِ الذراعِ قبلَ كلِّ موجة.
#   gatewayRequest 5 وIMMEDIATE_REDISPATCH_LIMIT 50 دونَ تغيير. لا قاعدةَ إنتاج، لا Render، لا تيليجرامَ حقيقي.
on:
  push:
    branches: [exp/load01-boot-ab]
    paths:
      - deploy/capacity-run/b24-runner/seat-load01-boot-ab.sh
      - deploy/capacity-run/b24-runner/PROTOCOL-load01-boot-ab.md
      - .github/workflows/load01-boot-ab.yml

permissions:
  contents: read

env:
  # PROTOCOL-load01-boot-ab.md §2: A = رأسُ #655؛ B = A + #656 + #657 (شيفرةُ البوّابةِ وحدَها، القالبُ واحد). البوّابةُ من wt-ref مُبدَّلًا لكلِّ ذراع.
  A_SHA: 5789a2e2bff18b6710f03ab96943aa1048c74d88
  B_SHA: ea022af6bd08d0fb7970493f5f1178c1dcf2102a
  REF_SHA: 5789a2e2bff18b6710f03ab96943aa1048c74d88
  MIXED_RATE: "20"
  MIXED_SEED: "1"

jobs:
  seat:
    name: "boot-ab (scenarios=1500, cities=5)"
    runs-on: ubuntu-26.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: تجهيز المقعد
        run: sudo bash deploy/capacity-run/b24-runner/provision-root.sh

      - name: نسخة المستودع للمستخدم user
        run: |
          sudo cp -a "$GITHUB_WORKSPACE" /home/user/workspace/ceezr
          sudo chown -R user:user /home/user/workspace/ceezr
          for X in "$A_SHA" "$B_SHA" "$REF_SHA"; do sudo -u user git -C /home/user/workspace/ceezr cat-file -e "$X^{commit}"; done

      - name: المقعد والموجة (داخل ceezrseat.slice)
        run: |
          sudo systemd-run --quiet --wait --pipe --collect --slice=ceezrseat.slice \
            --uid=user --gid=user -p LimitNOFILE=65536 -p WorkingDirectory=/home/user \
            --setenv=A_SHA="$A_SHA" --setenv=B_SHA="$B_SHA" --setenv=REF_SHA="$REF_SHA" --setenv=MIXED_RATE="$MIXED_RATE" --setenv=MIXED_SEED="$MIXED_SEED" --setenv=CONC="1500" --setenv=CITIES="JED,MKK,RUH,TIF,MED" \
            bash /home/user/workspace/ceezr/deploy/capacity-run/b24-runner/seat-load01-boot-ab.sh

      - name: رفع الدليل (لا يُرفعُ إلا بنجاحِ تدقيقِ الأسرار)
        uses: actions/upload-artifact@v5
        with:
          name: load01boot-ab
          path: /home/user/load01boot-out/
          if-no-files-found: warn
          retention-days: 30

      - name: رفع تقرير الفشل المنقح (تدقيقُ الأسرارِ وحدَه)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: load01boot-ab-failure-report
          path: /home/user/load01boot-out/secret-audit.txt
          if-no-files-found: ignore
